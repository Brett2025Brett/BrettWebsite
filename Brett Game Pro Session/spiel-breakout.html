<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Breakout — BRETT Game PRO Session</title>
<link rel="stylesheet" href="style3.css">
<style>
  .game-wrap{ margin-top:26px; text-align:center; }
  canvas{
    background:var(--void); border:1px solid var(--line); border-radius:10px;
    box-shadow:0 20px 50px -20px rgba(255,90,31,0.3);
    max-width:100%;
  }
  .hud{
    display:flex; justify-content:center; gap:30px; margin-bottom:16px;
    font-family:'Rajdhani',sans-serif; font-weight:700; font-size:1.1rem; color:var(--glow);
  }
  .tool-btn{
    font-family:'Rajdhani',sans-serif; font-weight:700; font-size:0.95rem;
    padding:12px 26px; border-radius:8px; border:none; cursor:pointer;
    color:var(--void); background:linear-gradient(135deg, var(--glow), var(--ember));
    box-shadow:0 10px 24px -10px rgba(255,90,31,0.55); margin-top:20px;
    transition:transform .2s ease;
  }
  .tool-btn:hover{ transform:translateY(-2px); }
  .hint{ margin-top:14px; font-size:0.82rem; color:var(--ash-dim); }
</style>
</head>
<body>

<header class="top">
  <div class="nav-wrap">
    <div class="brand"><span class="mark">BRETT</span><span class="tag">We know</span></div>
    <nav class="links">
      <a href="mainpage.html">Willkommen</a>
      <a href="downloadcenter_new.html">Downloads</a>
      <a href="Online-tools.html">Onlinetools</a>
      <a href="Lizenz.html">Lizenz</a>
      <a href="brett-spiele.html" class="active">Spiele</a>
    </nav>
  </div>
</header>

<main>
  <a class="back-link" href="brett-game-pro-session.html">Zurück zur PRO Session</a>
  <span class="eyebrow">Brett Game PRO Session</span>
  <h1 class="page-title">Breakout</h1>
  <p class="lede">Steuerung: Maus bewegen oder Pfeiltasten links/rechts.</p>

  <div class="game-wrap">
    <div class="hud">
      <div>Punkte: <span id="score">0</span></div>
      <div>Leben: <span id="lives">3</span></div>
    </div>
    <canvas id="game" width="480" height="400"></canvas>
    <br>
    <button class="tool-btn" onclick="resetGame()">Neustart</button>
    <p class="hint">Alle Steine treffen, ohne den Ball fallen zu lassen.</p>
  </div>
</main>

<script>
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const W = canvas.width, H = canvas.height;

  const paddleW = 90, paddleH = 12;
  let paddleX;
  let ballX, ballY, ballDX, ballDY;
  const ballR = 7;
  let bricks = [];
  const brickRows = 5, brickCols = 8;
  const brickW = 50, brickH = 18, brickGap = 6, brickTop = 40, brickLeft = 15;
  let score, lives, running, rightPressed = false, leftPressed = false;

  function initBricks() {
    bricks = [];
    const colors = ['#ff5a1f', '#ff7a3d', '#ffb44d', '#ff9c5c', '#ff8a4a'];
    for (let r = 0; r < brickRows; r++) {
      for (let c = 0; c < brickCols; c++) {
        bricks.push({ x: brickLeft + c * (brickW + brickGap), y: brickTop + r * (brickH + brickGap), alive: true, color: colors[r % colors.length] });
      }
    }
  }

  function resetGame() {
    paddleX = W / 2 - paddleW / 2;
    ballX = W / 2; ballY = H - 40;
    ballDX = 3; ballDY = -3;
    score = 0; lives = 3; running = true;
    document.getElementById('score').textContent = score;
    document.getElementById('lives').textContent = lives;
    initBricks();
  }

  document.addEventListener('keydown', e => {
    if (e.key === 'ArrowRight') rightPressed = true;
    if (e.key === 'ArrowLeft') leftPressed = true;
  });
  document.addEventListener('keyup', e => {
    if (e.key === 'ArrowRight') rightPressed = false;
    if (e.key === 'ArrowLeft') leftPressed = false;
  });
  canvas.addEventListener('mousemove', e => {
    const rect = canvas.getBoundingClientRect();
    const relX = (e.clientX - rect.left) * (W / rect.width);
    paddleX = Math.max(0, Math.min(W - paddleW, relX - paddleW / 2));
  });

  function draw() {
    ctx.fillStyle = '#0c0906';
    ctx.fillRect(0, 0, W, H);

    bricks.forEach(b => {
      if (!b.alive) return;
      ctx.fillStyle = b.color;
      ctx.fillRect(b.x, b.y, brickW, brickH);
    });

    ctx.fillStyle = '#ffb44d';
    ctx.fillRect(paddleX, H - 20, paddleW, paddleH);

    ctx.beginPath();
    ctx.arc(ballX, ballY, ballR, 0, Math.PI * 2);
    ctx.fillStyle = '#f2e6d8';
    ctx.fill();

    if (!running) {
      ctx.fillStyle = 'rgba(12,9,6,0.75)';
      ctx.fillRect(0, 0, W, H);
      ctx.fillStyle = '#ffb44d';
      ctx.font = 'bold 26px Rajdhani, sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText(lives <= 0 ? 'Game Over' : 'Gewonnen!', W/2, H/2);
    }
  }

  function update() {
    if (!running) return;

    if (rightPressed) paddleX = Math.min(W - paddleW, paddleX + 6);
    if (leftPressed) paddleX = Math.max(0, paddleX - 6);

    ballX += ballDX;
    ballY += ballDY;

    if (ballX < ballR || ballX > W - ballR) ballDX *= -1;
    if (ballY < ballR) ballDY *= -1;

    if (ballY > H - 20 - ballR && ballY < H - 20 + ballR &&
        ballX > paddleX && ballX < paddleX + paddleW) {
      ballDY *= -1;
      const hitPos = (ballX - paddleX) / paddleW - 0.5;
      ballDX += hitPos * 2;
    }

    if (ballY > H) {
      lives--;
      document.getElementById('lives').textContent = lives;
      if (lives <= 0) { running = false; }
      else { ballX = W/2; ballY = H-40; ballDX = 3; ballDY = -3; }
    }

    bricks.forEach(b => {
      if (!b.alive) return;
      if (ballX > b.x && ballX < b.x + brickW && ballY > b.y && ballY < b.y + brickH) {
        b.alive = false;
        ballDY *= -1;
        score += 10;
        document.getElementById('score').textContent = score;
      }
    });

    if (bricks.every(b => !b.alive)) running = false;

    draw();
    requestAnimationFrame(update);
  }

  resetGame();
  update();
</script>

</body>
</html>
