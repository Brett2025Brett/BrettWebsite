<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BRETT Enterprise Platform</title>

<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif;}

body{
  height:100vh;
  display:flex;
  background:#0b1220;
  color:white;
  overflow:hidden;
}

/* ===== PARTICLES ===== */
canvas{
  position:fixed;
  top:0;
  left:0;
  z-index:0;
}

/* ===== SIDEBAR ===== */
.sidebar{
  width:260px;
  background:rgba(20,30,60,0.7);
  backdrop-filter:blur(25px);
  padding:25px;
  display:flex;
  flex-direction:column;
  justify-content:space-between;
  z-index:2;
  transition:.3s;
}

.logo{
  font-size:22px;
  font-weight:bold;
  color:#00f2ff;
  margin-bottom:30px;
  text-shadow:0 0 15px #00f2ff;
}

.nav a{
  display:flex;
  align-items:center;
  gap:12px;
  padding:12px;
  margin-bottom:10px;
  border-radius:10px;
  text-decoration:none;
  color:#ccc;
  transition:.3s;
}

.nav a:hover{
  background:#00f2ff;
  color:black;
  box-shadow:0 0 20px #00f2ff;
}

.logout button{
  width:100%;
  padding:10px;
  border:none;
  border-radius:8px;
  background:#ff3b3b;
  color:white;
  cursor:pointer;
}

/* ===== MAIN ===== */
.main{
  flex:1;
  padding:40px;
  overflow-y:auto;
  position:relative;
  z-index:1;
}

/* ===== GRID DRAGGABLE ===== */
.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(300px,1fr));
  gap:20px;
}

.card{
  background:rgba(255,255,255,0.05);
  backdrop-filter:blur(20px);
  padding:20px;
  border-radius:15px;
  cursor:grab;
  transition:.3s;
}

.card:hover{
  transform:translateY(-5px);
  box-shadow:0 0 30px #00f2ff55;
}

.notifications{
  position:absolute;
  top:20px;
  right:20px;
  background:#00f2ff;
  color:black;
  padding:8px 12px;
  border-radius:20px;
  font-size:12px;
}

.hamburger{
  display:none;
  position:absolute;
  top:20px;
  left:20px;
  font-size:22px;
  cursor:pointer;
  z-index:5;
}

@media(max-width:768px){
  .sidebar{
    position:fixed;
    left:-280px;
    height:100%;
  }
  .sidebar.active{left:0;}
  .hamburger{display:block;}
}
</style>
</head>
<body>

<canvas id="particles"></canvas>

<div class="hamburger" onclick="toggleMenu()">
<i class="fas fa-bars"></i>
</div>

<div class="sidebar" id="sidebar">
  <div>
    <div class="logo">BRETT</div>
    <div class="nav">
      <a href="#"><i class="fas fa-home"></i> Home</a>
      <a href="https://brett2025brett.github.io/BrettWebsite/downloadcenter.html">
        <i class="fas fa-download"></i> Downloads
      </a>
      <a href="https://brett2025brett.github.io/BrettWebsite/projekte.html">
        <i class="fas fa-folder"></i> Projekte</a>
      <a href="https://brett2025brett.github.io/BrettWebsite/account.html">
        <i class="fas fa-user"></i> Account</a>
    </div>
  </div>
  <div class="logout">
    <button id="logoutBtn">Logout</button>
  </div>
</div>

<div class="main">

<div class="notifications">
🔔 3 Neue Aktivitäten
</div>

<h1 style="margin-bottom:30px;">BRETT Enterprise Platform</h1>

<div class="grid">

<div class="card" draggable="true">
<h3>Live Downloads</h3>
<canvas id="chart"></canvas>
</div>

<div class="card" draggable="true">
<h3>System Status</h3>
<p>Server: Online</p>
<p>API: Stabil</p>
<p>Security: Aktiv</p>
</div>

<div class="card" draggable="true">
<h3>User</h3>
<p id="user"></p>
</div>

</div>
</div>

<script type="module">
import { getSession, logout } from "./auth.js";

const LOGIN_URL="https://brett2025brett.github.io/BrettWebsite/BRETT_ACCOUNTSYSTEM%20(1)/brett_accunts%20-%20Kopie/logonUI.html";

const userEl=document.getElementById("user");

(async()=>{
  const session=await getSession();
  if(!session){
    window.location.href=LOGIN_URL;
    return;
  }
  userEl.textContent="Eingeloggt als: "+session.user.email;
})();

document.getElementById("logoutBtn").onclick=async()=>{
  await logout();
  window.location.href=LOGIN_URL;
};

/* Chart */
new Chart(document.getElementById("chart"),{
  type:"bar",
  data:{
    labels:["Jan","Feb","Mär","Apr","Mai","Jun"],
    datasets:[{
      label:"Downloads",
      data:[12,25,18,30,22,40],
      backgroundColor:"#00f2ff"
    }]
  },
  options:{
    plugins:{legend:{labels:{color:"white"}}},
    scales:{
      x:{ticks:{color:"white"}},
      y:{ticks:{color:"white"}}
    }
  }
});

/* PARTICLES */
const canvas=document.getElementById("particles");
const ctx=canvas.getContext("2d");
canvas.width=window.innerWidth;
canvas.height=window.innerHeight;

let particles=[];
for(let i=0;i<80;i++){
  particles.push({
    x:Math.random()*canvas.width,
    y:Math.random()*canvas.height,
    r:Math.random()*2,
    dx:(Math.random()-0.5),
    dy:(Math.random()-0.5)
  });
}

function animate(){
  ctx.clearRect(0,0,canvas.width,canvas.height);
  ctx.fillStyle="#00f2ff";
  particles.forEach(p=>{
    ctx.beginPath();
    ctx.arc(p.x,p.y,p.r,0,Math.PI*2);
    ctx.fill();
    p.x+=p.dx;
    p.y+=p.dy;
  });
  requestAnimationFrame(animate);
}
animate();

window.toggleMenu=function(){
  document.getElementById("sidebar").classList.toggle("active");
}
</script>

</body>
</html>
