<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BRETT | Dashboard</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">

<style>
* {
  box-sizing: border-box;
}
html, body {
  margin: 0;
  height: 100%;
  font-family: 'Inter', sans-serif;
  background: #0f1117;
  color: white;
  overflow: hidden;
}

/* Layout */
.app {
  display: flex;
  height: 100%;
}

/* Sidebar */
.sidebar {
  width: 260px;
  background: #0b0d12;
  padding: 25px 20px;
  display: flex;
  flex-direction: column;
  border-right: 1px solid rgba(255,255,255,0.05);
  transition: transform 0.3s ease;
}

.logo {
  font-size: 22px;
  font-weight: 700;
  color: #00c6ff;
  margin-bottom: 40px;
}

.nav-item {
  padding: 12px 15px;
  border-radius: 10px;
  margin-bottom: 8px;
  cursor: pointer;
  transition: 0.2s;
  opacity: 0.85;
}

.nav-item:hover {
  background: rgba(0,198,255,0.1);
  opacity: 1;
}

.logout {
  margin-top: auto;
  padding: 12px;
  border-radius: 10px;
  background: rgba(255,75,43,0.1);
  color: #ff4b2b;
  border: none;
  cursor: pointer;
  transition: 0.2s;
}

.logout:hover {
  background: rgba(255,75,43,0.25);
}

/* Main Content */
.main {
  flex: 1;
  padding: 40px;
  overflow-y: auto;
}

.header {
  font-size: 28px;
  font-weight: 700;
}

.sub {
  margin-bottom: 40px;
  opacity: 0.7;
}

/* Cards */
.grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
  gap: 25px;
}

.card {
  background: #151922;
  padding: 25px;
  border-radius: 16px;
  transition: 0.3s;
  border: 1px solid rgba(255,255,255,0.05);
}

.card:hover {
  transform: translateY(-5px);
  border: 1px solid #00c6ff;
  box-shadow: 0 10px 30px rgba(0,198,255,0.15);
}

.card h3 {
  margin-top: 0;
  color: #00c6ff;
}

.card p {
  opacity: 0.8;
  font-size: 14px;
}

/* Hamburger */
.hamburger {
  display: none;
  position: fixed;
  top: 20px;
  left: 20px;
  font-size: 26px;
  cursor: pointer;
  z-index: 1000;
}

/* Overlay */
.overlay {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.6);
  z-index: 900;
}

/* Mobile */
@media (max-width: 900px) {
  .sidebar {
    position: fixed;
    height: 100%;
    transform: translateX(-100%);
    z-index: 1001;
  }

  .sidebar.active {
    transform: translateX(0);
  }

  .hamburger {
    display: block;
  }

  .overlay.active {
    display: block;
  }

  .main {
    padding: 80px 25px 25px 25px;
  }
}
</style>
</head>

<body>

<div class="hamburger" id="hamburger">☰</div>
<div class="overlay" id="overlay"></div>

<div class="app">

  <div class="sidebar" id="sidebar">
    <div class="logo">BRETT</div>

    <div class="nav-item">🏠 Dashboard</div>
    <div class="nav-item">⬇ Downloads</div>
    <div class="nav-item">⚙ Einstellungen</div>
    <div class="nav-item">📊 Aktivitäten</div>

    <button id="logoutBtn" class="logout">Logout</button>
  </div>

  <div class="main">
    <div class="header">Willkommen zurück 👋</div>
    <div class="sub" id="user"></div>

    <div class="grid">

      <div class="card">
        <h3>👤 Profil</h3>
        <p id="cardEmail"></p>
      </div>

      <div class="card">
        <h3>🟢 Status</h3>
        <p>System aktiv & verbunden</p>
      </div>

      <div class="card">
        <h3>⬇ Downloads</h3>
        <p>3 Produkte verfügbar</p>
      </div>

      <div class="card">
        <h3>🚀 Version</h3>
        <p>BRETT Dashboard v2.0</p>
      </div>

    </div>
  </div>

</div>

<script type="module">
  import { getSession, logout } from "./auth.js";

  const sidebar = document.getElementById("sidebar");
  const hamburger = document.getElementById("hamburger");
  const overlay = document.getElementById("overlay");
  const userEl = document.getElementById("user");
  const emailCard = document.getElementById("cardEmail");

  hamburger.onclick = () => {
    sidebar.classList.toggle("active");
    overlay.classList.toggle("active");
  };

  overlay.onclick = () => {
    sidebar.classList.remove("active");
    overlay.classList.remove("active");
  };

  (async () => {
    const session = await getSession();
    if (!session) {
      window.location.href = "logonUI.html";
      return;
    }
    userEl.textContent = "Eingeloggt als: " + session.user.email;
    emailCard.textContent = session.user.email;
  })();

  document.getElementById("logoutBtn").onclick = async () => {
    await logout();
    window.location.href = "logonUI.html";
  };
</script>

</body>
</html>
