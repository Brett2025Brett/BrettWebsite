<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BRETT | Dashboard</title>

<style>
body {
  margin: 0;
  font-family: 'Segoe UI', sans-serif;
  display: flex;
  height: 100vh;
  background: linear-gradient(135deg,#ff7043,#e64a19);
}

/* SIDEBAR */
.sidebar {
  width: 250px;
  background: rgba(0,0,0,0.3);
  backdrop-filter: blur(10px);
  padding: 30px;
  color: white;
}

.sidebar h2 {
  text-align: center;
  margin-bottom: 40px;
}

.sidebar a {
  display: block;
  padding: 12px;
  margin-bottom: 15px;
  background: rgba(255,255,255,0.2);
  border-radius: 10px;
  text-decoration: none;
  color: white;
  transition: 0.3s;
}

.sidebar a:hover {
  transform: translateX(5px);
  background: rgba(255,255,255,0.35);
}

/* MAIN */
.main {
  flex: 1;
  padding: 50px;
  color: white;
}

.card-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(220px,1fr));
  gap: 25px;
  margin-top: 40px;
}

.card {
  background: rgba(255,255,255,0.15);
  padding: 30px;
  border-radius: 20px;
  backdrop-filter: blur(15px);
  transition: 0.3s;
}

.card:hover {
  transform: translateY(-8px);
}
</style>
</head>

<body>

<div class="sidebar">
  <h2>BRETT</h2>

  <a href="downloadcenter.html">Downloadcenter</a>
  <a href="Online-tools.html">Online Tools</a>
  <a href="Lizenz.html">Lizenz</a>
  <a href="logonUI.html">Logout</a>
</div>

<div class="main">
  <h1>Willkommen im Dashboard</h1>

  <div class="card-grid">
    <div class="card">📦 Downloads verwalten</div>
    <div class="card">🛠 Tools nutzen</div>
    <div class="card">🔐 Lizenz prüfen</div>
  </div>
</div>

</body>
</html>
