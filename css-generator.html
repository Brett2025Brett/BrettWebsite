<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CSS-Generator — BRETT</title>
<link rel="stylesheet" href="style3.css">
<style>
  .tabs{ display:flex; gap:10px; margin:26px 0 0; flex-wrap:wrap; }
  .tab{
    padding:9px 20px; border-radius:20px; font-size:0.85rem; cursor:pointer;
    border:1px solid var(--line); color:var(--ash);
    transition:all .2s ease;
  }
  .tab.active{ background:linear-gradient(135deg, var(--glow), var(--ember)); color:var(--void); border-color:transparent; font-weight:600; }
  .layout{ display:flex; gap:24px; margin-top:16px; flex-wrap:wrap; }
  .controls{
    background:linear-gradient(180deg, var(--char-2), var(--char));
    border:1px solid var(--line); border-radius:var(--radius);
    padding:26px; flex:1; min-width:260px;
  }
  .field{ margin-bottom:18px; }
  .field label{ display:block; font-size:0.8rem; font-weight:600; color:var(--ash); margin-bottom:6px; }
  select, input[type="number"], input[type="range"]{
    width:100%; background:var(--void); border:1px solid var(--line); color:var(--paper);
    font-family:'Inter', sans-serif; font-size:0.88rem; padding:9px 12px; border-radius:8px; outline:none;
  }
  .preview-wrap{ flex:1; min-width:280px; }
  .preview{
    background:var(--void); border:1px solid var(--line); border-radius:10px;
    padding:16px; min-height:220px;
  }
  .preview .box{
    background:linear-gradient(135deg, var(--glow), var(--ember));
    color:var(--void); font-family:'Rajdhani',sans-serif; font-weight:700;
    display:flex; align-items:center; justify-content:center;
    border-radius:6px; min-height:40px;
  }
  #cssOutput{
    margin-top:16px; width:100%; min-height:160px;
    background:var(--void); border:1px solid var(--line); color:var(--paper);
    font-family:'Courier New', monospace; font-size:0.82rem; padding:14px; border-radius:8px;
    resize:vertical;
  }
  .copy-btn{
    margin-top:10px; font-family:'Rajdhani',sans-serif; font-weight:700; font-size:0.88rem;
    padding:9px 20px; border-radius:8px; border:none; cursor:pointer;
    color:var(--void); background:linear-gradient(135deg, var(--glow), var(--ember));
  }
</style>
</head>
<body>

<header class="top">
  <div class="nav-wrap">
    <div class="brand"><span class="mark">BRETT</span><span class="tag">We know</span></div>
    <nav class="links">
      <a href="mainpage.html">Willkommen</a>
      <a href="downloadcenter_new.html">Downloads</a>
      <a href="Online-tools.html" class="active">Onlinetools</a>
      <a href="Lizenz.html">Lizenz</a>
      <a href="brett-spiele.html">Spiele</a>
    </nav>
  </div>
</header>

<main>
  <a class="back-link" href="Online-tools.html">Zurück zu Onlinetools</a>
  <span class="eyebrow">Onlinetool</span>
  <h1 class="page-title">CSS-Generator</h1>
  <p class="lede">Grid- oder Flexbox-Layout einstellen, CSS live sehen und kopieren.</p>

  <div class="tabs" id="tabs">
    <div class="tab active" data-mode="flex">Flexbox</div>
    <div class="tab" data-mode="grid">Grid</div>
  </div>

  <div class="layout">
    <div class="controls" id="flexControls">
      <div class="field">
        <label for="flexDirection">flex-direction</label>
        <select id="flexDirection">
          <option>row</option><option>row-reverse</option><option>column</option><option>column-reverse</option>
        </select>
      </div>
      <div class="field">
        <label for="justifyContent">justify-content</label>
        <select id="justifyContent">
          <option>flex-start</option><option>center</option><option>flex-end</option><option>space-between</option><option>space-around</option><option>space-evenly</option>
        </select>
      </div>
      <div class="field">
        <label for="alignItems">align-items</label>
        <select id="alignItems">
          <option>stretch</option><option>flex-start</option><option>center</option><option>flex-end</option><option>baseline</option>
        </select>
      </div>
      <div class="field">
        <label for="flexGap">gap (px)</label>
        <input type="number" id="flexGap" value="12" min="0" max="60">
      </div>
      <div class="field">
        <label for="flexWrap">flex-wrap</label>
        <select id="flexWrap"><option>nowrap</option><option>wrap</option><option>wrap-reverse</option></select>
      </div>
    </div>

    <div class="controls" id="gridControls" style="display:none;">
      <div class="field">
        <label for="gridCols">Spalten</label>
        <input type="number" id="gridCols" value="3" min="1" max="8">
      </div>
      <div class="field">
        <label for="gridRows">Zeilen</label>
        <input type="number" id="gridRows" value="2" min="1" max="6">
      </div>
      <div class="field">
        <label for="gridGap">gap (px)</label>
        <input type="number" id="gridGap" value="12" min="0" max="60">
      </div>
      <div class="field">
        <label for="justifyItems">justify-items</label>
        <select id="justifyItems"><option>stretch</option><option>start</option><option>center</option><option>end</option></select>
      </div>
      <div class="field">
        <label for="alignItemsGrid">align-items</label>
        <select id="alignItemsGrid"><option>stretch</option><option>start</option><option>center</option><option>end</option></select>
      </div>
    </div>

    <div class="preview-wrap">
      <div class="preview" id="preview"></div>
      <textarea id="cssOutput" readonly></textarea>
      <button class="copy-btn" onclick="copyCSS()">CSS kopieren</button>
    </div>
  </div>
</main>

<script>
  let mode = 'flex';
  const preview = document.getElementById('preview');
  const output = document.getElementById('cssOutput');

  document.getElementById('tabs').addEventListener('click', (e) => {
    if (!e.target.classList.contains('tab')) return;
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    e.target.classList.add('active');
    mode = e.target.dataset.mode;
    document.getElementById('flexControls').style.display = mode === 'flex' ? 'block' : 'none';
    document.getElementById('gridControls').style.display = mode === 'grid' ? 'block' : 'none';
    update();
  });

  function buildBoxes(n) {
    let html = '';
    for (let i = 1; i <= n; i++) html += `<div class="box" style="padding:14px;">${i}</div>`;
    return html;
  }

  function update() {
    if (mode === 'flex') {
      const dir = document.getElementById('flexDirection').value;
      const justify = document.getElementById('justifyContent').value;
      const align = document.getElementById('alignItems').value;
      const gap = document.getElementById('flexGap').value;
      const wrap = document.getElementById('flexWrap').value;

      preview.style.cssText = `display:flex; flex-direction:${dir}; justify-content:${justify}; align-items:${align}; gap:${gap}px; flex-wrap:${wrap};`;
      preview.innerHTML = buildBoxes(5);

      output.value =
`.container {
  display: flex;
  flex-direction: ${dir};
  justify-content: ${justify};
  align-items: ${align};
  flex-wrap: ${wrap};
  gap: ${gap}px;
}`;
    } else {
      const cols = document.getElementById('gridCols').value;
      const rows = document.getElementById('gridRows').value;
      const gap = document.getElementById('gridGap').value;
      const justifyItems = document.getElementById('justifyItems').value;
      const alignItems = document.getElementById('alignItemsGrid').value;

      preview.style.cssText = `display:grid; grid-template-columns:repeat(${cols}, 1fr); grid-template-rows:repeat(${rows}, 1fr); gap:${gap}px; justify-items:${justifyItems}; align-items:${alignItems};`;
      preview.innerHTML = buildBoxes(cols * rows);

      output.value =
`.container {
  display: grid;
  grid-template-columns: repeat(${cols}, 1fr);
  grid-template-rows: repeat(${rows}, 1fr);
  gap: ${gap}px;
  justify-items: ${justifyItems};
  align-items: ${alignItems};
}`;
    }
  }

  document.querySelectorAll('select, input').forEach(el => el.addEventListener('input', update));
  function copyCSS() { navigator.clipboard.writeText(output.value); }

  update();
</script>

</body>
</html>
