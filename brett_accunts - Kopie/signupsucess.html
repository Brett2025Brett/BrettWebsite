<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BRETT | Registrierung erfolgreich</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  font-family: 'Segoe UI', sans-serif;
}

body {
  background: linear-gradient(135deg, #ff7043, #e64a19);
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
}

/* BOX */
.box {
  background: rgba(255,255,255,0.15);
  backdrop-filter: blur(15px);
  padding: 40px;
  width: 380px;
  border-radius: 20px;
  box-shadow: 0 20px 40px rgba(0,0,0,0.3);
  text-align: center;
  color: white;
  animation: fadeIn 0.6s ease;
}

@keyframes fadeIn {
  from { opacity:0; transform: translateY(20px); }
  to { opacity:1; transform: translateY(0); }
}

.success-icon {
  font-size: 60px;
  margin-bottom: 20px;
  color: #00ffae;
}

.box h1 {
  margin-bottom: 15px;
}

.box p {
  font-size: 14px;
  margin-bottom: 25px;
  line-height: 1.6;
}

.btn {
  display: inline-block;
  padding: 12px 25px;
  border-radius: 30px;
  background: white;
  color: #e64a19;
  text-decoration: none;
  font-weight: bold;
  transition: 0.3s;
}

.btn:hover {
  transform: scale(1.05);
}
</style>
</head>

<body>

<div class="box">
  <div class="success-icon">
    <i class="fa-solid fa-circle-check"></i>
  </div>

  <h1>Registrierung erfolgreich</h1>

  <p>
    Ihre Registrierung wurde erfolgreich abgeschlossen.<br><br>
    Wir haben Ihnen eine E-Mail zugesandt, in der Sie Ihre Adresse bestätigen können.
    Vielen Dank!
  </p>

  <a href="logonUI.html" class="btn">
    Zurück zur Anmeldung
  </a>
</div>

</body>
</html>
