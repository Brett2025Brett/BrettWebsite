<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BRETT | Login</title>

<link rel="icon" href="Bilder/Brett Lopo neu.png">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  font-family: 'Segoe UI', sans-serif;
}

/* NAVBAR */
.navbar {
  position: fixed;
  top: 0;
  width: 100%;
  background: #333;
  display: flex;
  align-items: center;
  padding: 10px 20px;
  z-index: 1000;
}

.navbar img {
  height: 60px;
  margin-right: 20px;
}

.download-button {
  padding: 8px 15px;
  margin-right: 10px;
  border: none;
  border-radius: 20px;
  background: #ff7043;
  color: white;
  cursor: pointer;
  transition: 0.3s;
}

.download-button:hover {
  background: #e64a19;
}

.login-btn {
  margin-left: auto;
  font-size: 22px;
  color: white;
  background: #007bff;
  padding: 10px;
  border-radius: 50%;
  text-decoration: none;
  transition: 0.3s;
}

.login-btn:hover {
  background: #0056b3;
}

/* BODY */
body {
  background: linear-gradient(135deg, #ff7043, #e64a19);
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
}

/* LOGIN BOX */
.box {
  background: rgba(255,255,255,0.15);
  backdrop-filter: blur(15px);
  padding: 40px;
  width: 350px;
  border-radius: 20px;
  box-shadow: 0 20px 40px rgba(0,0,0,0.3);
  text-align: center;
  color: white;
  animation: fadeIn 0.6s ease;
  margin-top: 80px;
}

@keyframes fadeIn {
  from { opacity:0; transform: translateY(20px); }
  to { opacity:1; transform: translateY(0); }
}

.box h1 {
  margin-bottom: 20px;
}

.box input {
  width: 100%;
  padding: 12px;
  margin: 10px 0;
  border: none;
  border-radius: 30px;
  outline: none;
}

.btn {
  width: 100%;
  padding: 12px;
  margin-top: 15px;
  border: none;
  border-radius: 30px;
  background: white;
  color: #e64a19;
  font-weight: bold;
  cursor: pointer;
  transition: 0.3s;
}

.btn:hover {
  transform: scale(1.05);
}

.loader {
  border: 4px solid rgba(255,255,255,0.3);
  border-top: 4px solid white;
  border-radius: 50%;
  width: 30px;
  height: 30px;
  margin: 15px auto;
  animation: spin 1s linear infinite;
}

@keyframes spin {
  100% { transform: rotate(360deg); }
}

#msg {
  margin-top: 10px;
  font-size: 14px;
}
</style>
</head>

<body>

<!-- NAVBAR -->

<!-- LOGIN BOX -->
<div class="box">
  <h1>BRETT Login</h1>

  <input id="email" type="email" placeholder="E-Mail">
  <input id="password" type="password" placeholder="Passwort">

  <p id="msg"></p>

  <button id="loginBtn" class="btn">Anmelden</button>
  <div id="spinner" class="loader" style="display:none;"></div>

  <a href="signup.html" style="color:white; font-size:13px;">
    Noch kein Konto? Registrieren
  </a>
</div>

<!-- SCRIPT -->
<script type="module">
import { login, getSession } from "./auth.js";

const emailField = document.getElementById("email");
const passwordField = document.getElementById("password");
const msg = document.getElementById("msg");
const loginBtn = document.getElementById("loginBtn");
const spinner = document.getElementById("spinner");

async function loadLoginRegisterData() {
  msg.textContent = "";

  emailField.style.display = "none";
  passwordField.style.display = "none";
  loginBtn.style.display = "none";
  spinner.style.display = "block";

  try {
    await login(emailField.value, passwordField.value);
    msg.textContent = "Login erfolgreich. Weiterleitung...";
    setTimeout(() => window.location.href = "dashboard.html", 1000);
  } catch (err) {
    msg.textContent = err.message;
    emailField.style.display = "block";
    passwordField.style.display = "block";
    loginBtn.style.display = "block";
    spinner.style.display = "none";
  }
}

loginBtn.addEventListener("click", loadLoginRegisterData);

(async () => {
  const session = await getSession();
  if (session) window.location.href = "dashboard.html";
})();
</script>

</body>
</html>
