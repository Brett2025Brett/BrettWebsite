<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pong — BRETT Game PRO Session</title>
<link rel="stylesheet" href="style3.css">
<style>
  .game-wrap{ margin-top:26px; text-align:center; }
  canvas{
    background:var(--void); border:1px solid var(--line); border-radius:10px;
    box-shadow:0 20px 50px -20px rgba(255,90,31,0.3);
    max-width:100%;
  }
  .hud{
    display:flex; justify-content:center; gap:30px; margin-bottom:16px;
    font-family:'Rajdhani',sans-serif; font-weight:700; font-size:1.1rem; color:var(--glow);
  }
  .tool-btn{
    font-family:'Rajdhani',sans-serif; font-weight:700; font-size:0.95rem;
    padding:12px 26px; border-radius:8px; border:none; cursor:pointer;
    color:var(--void); background:linear-gradient(135deg, var(--glow), var(--ember));
    box-shadow:0 10px 24px -10px rgba(255,90,31,0.55); margin-top:20px;
    transition:transform .2s ease;
  }
  .tool-btn:hover{ transform:translateY(-2px); }
  .hint{ margin-top:14px; font-size:0.82rem; color:var(--ash-dim); }
</style>
</head>
<body>

<header class="top">
  <div class="nav-wrap">
    <div class="brand"><span class="mark">BRETT</span><span class="tag">We know</span></div>
    <nav class="links">
      <a href="mainpage.html">Willkommen</a>
      <a href="downloadcenter_new.html">Downloads</a>
      <a href="Online-tools.html">Onlinetools</a>
      <a href="Lizenz.html">Lizenz</a>
      <a href="brett-spiele.html" class="active">Spiele</a>
    </nav>
  </div>
</header>

<main>
  <a class="back-link" href="brett-game-pro-session.html">Zurück zur PRO Session</a>
  <span class="eyebrow">Brett Game PRO Session</span>
  <h1 class="page-title">Pong</h1>
  <p class="lede">Steuerung: Maus bewegen oder Pfeiltasten hoch/runter. Erster auf 7 Punkte gewinnt.</p>

  <div class="game-wrap">
    <div class="hud">
      <div>Du: <span id="p1">0</span></div>
      <div>KI: <span id="p2">0</span></div>
    </div>
    <canvas id="game" width="480" height="320"></canvas>
    <br>
    <button class="tool-btn" onclick="resetGame()">Neustart</button>
    <p class="hint"></p>
  </div>
</main>

<script>
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const W = canvas.width, H = canvas.height;
  const paddleH = 60, paddleW = 10;
  let p1Y, p2Y, ballX, ballY, ballDX, ballDY, score1, score2, running, upPressed, downPressed;

  function resetGame() {
    p1Y = H/2 - paddleH/2;
    p2Y = H/2 - paddleH/2;
    ballX = W/2; ballY = H/2;
    ballDX = 4; ballDY = 3;
    score1 = 0; score2 = 0; running = true;
    document.getElementById('p1').textContent = score1;
    document.getElementById('p2').textContent = score2;
  }

  document.addEventListener('keydown', e => {
    if (e.key === 'ArrowUp') upPressed = true;
    if (e.key === 'ArrowDown') downPressed = true;
  });
  document.addEventListener('keyup', e => {
    if (e.key === 'ArrowUp') upPressed = false;
    if (e.key === 'ArrowDown') downPressed = false;
  });
  canvas.addEventListener('mousemove', e => {
    const rect = canvas.getBoundingClientRect();
    const relY = (e.clientY - rect.top) * (H / rect.height);
    p1Y = Math.max(0, Math.min(H - paddleH, relY - paddleH/2));
  });

  function draw() {
    ctx.fillStyle = '#0c0906';
    ctx.fillRect(0, 0, W, H);

    ctx.strokeStyle = 'rgba(255,138,61,0.2)';
    ctx.setLineDash([6,8]);
    ctx.beginPath();
    ctx.moveTo(W/2, 0); ctx.lineTo(W/2, H);
    ctx.stroke();
    ctx.setLineDash([]);

    ctx.fillStyle = '#ffb44d';
    ctx.fillRect(10, p1Y, paddleW, paddleH);
    ctx.fillStyle = '#ff5a1f';
    ctx.fillRect(W - 20, p2Y, paddleW, paddleH);

    ctx.beginPath();
    ctx.arc(ballX, ballY, 7, 0, Math.PI * 2);
    ctx.fillStyle = '#f2e6d8';
    ctx.fill();

    if (!running) {
      ctx.fillStyle = 'rgba(12,9,6,0.75)';
      ctx.fillRect(0, 0, W, H);
      ctx.fillStyle = '#ffb44d';
      ctx.font = 'bold 26px Rajdhani, sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText(score1 > score2 ? 'Du hast gewonnen!' : 'Die KI hat gewonnen.', W/2, H/2);
    }
  }

  function update() {
    if (!running) { draw(); requestAnimationFrame(update); return; }

    if (upPressed) p1Y = Math.max(0, p1Y - 6);
    if (downPressed) p1Y = Math.min(H - paddleH, p1Y + 6);

    const aiCenter = p2Y + paddleH/2;
    if (aiCenter < ballY - 10) p2Y = Math.min(H - paddleH, p2Y + 4.2);
    else if (aiCenter > ballY + 10) p2Y = Math.max(0, p2Y - 4.2);

    ballX += ballDX;
    ballY += ballDY;

    if (ballY < 7 || ballY > H - 7) ballDY *= -1;

    if (ballX < 20 && ballY > p1Y && ballY < p1Y + paddleH) {
      ballDX *= -1.05;
      ballDY += (ballY - (p1Y + paddleH/2)) * 0.1;
      ballX = 20;
    }
    if (ballX > W - 20 && ballY > p2Y && ballY < p2Y + paddleH) {
      ballDX *= -1.05;
      ballDY += (ballY - (p2Y + paddleH/2)) * 0.1;
      ballX = W - 20;
    }

    if (ballX < 0) {
      score2++;
      document.getElementById('p2').textContent = score2;
      resetBall();
    } else if (ballX > W) {
      score1++;
      document.getElementById('p1').textContent = score1;
      resetBall();
    }

    if (score1 >= 7 || score2 >= 7) running = false;

    draw();
    requestAnimationFrame(update);
  }

  function resetBall() {
    ballX = W/2; ballY = H/2;
    ballDX = (Math.random() > 0.5 ? 4 : -4);
    ballDY = (Math.random() - 0.5) * 6;
  }

  resetGame();
  update();
</script>

</body>
</html>
