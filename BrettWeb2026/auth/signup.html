<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BRETT | Registrierung</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">

<style>
* {
  box-sizing: border-box;
}

html, body {
  height: 100%;
  margin: 0;
  font-family: 'Inter', sans-serif;
}

body {
  display: flex;
  justify-content: center;
  align-items: center;
  background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
}

/* Card */
.box {
  width: 420px;
  padding: 40px;
  border-radius: 18px;
  backdrop-filter: blur(20px);
  background: rgba(255,255,255,0.08);
  border: 1px solid rgba(255,255,255,0.15);
  box-shadow: 0 20px 40px rgba(0,0,0,0.4);
  color: white;
  animation: fadeIn 0.6s ease;
}

@keyframes fadeIn {
  from {opacity:0; transform: translateY(20px);}
  to {opacity:1; transform: translateY(0);}
}

h1 {
  margin: 0 0 10px 0;
  font-weight: 600;
}

p {
  margin: 5px 0;
}

hr {
  border: none;
  height: 1px;
  background: rgba(255,255,255,0.2);
  margin: 20px 0;
}

label {
  font-size: 14px;
  opacity: 0.8;
}

input {
  width: 100%;
  padding: 12px;
  margin-top: 6px;
  margin-bottom: 18px;
  border-radius: 10px;
  border: none;
  outline: none;
  background: rgba(255,255,255,0.15);
  color: white;
  font-size: 14px;
  transition: 0.3s;
}

input:focus {
  background: rgba(255,255,255,0.25);
}

.btn {
  width: 100%;
  padding: 12px;
  border-radius: 12px;
  border: none;
  font-size: 15px;
  font-weight: 600;
  cursor: pointer;
  background: linear-gradient(135deg, #00c6ff, #0072ff);
  color: white;
  transition: 0.3s;
}

.btn:hover {
  transform: translateY(-2px);
  box-shadow: 0 8px 20px rgba(0, 114, 255, 0.4);
}

a {
  color: #00c6ff;
  text-decoration: none;
  font-size: 14px;
}

a:hover {
  text-decoration: underline;
}

.rot { color: #ff6b6b; }
.blau { color: #4fc3f7; }
.gruen { color: #4caf50; }
.orangefarbig { color: #ffa726; }

.loader {
  border: 5px solid rgba(255,255,255,0.2);
  border-top: 5px solid #00c6ff;
  border-radius: 50%;
  width: 40px;
  height: 40px;
  margin: 15px auto;
  animation: spin 1s linear infinite;
}

@keyframes spin {
  0% { transform: rotate(0deg);}
  100% { transform: rotate(360deg);}
}
</style>
</head>

<body>

<div class="box">
  <p class="gruen"><strong>BRETT Login-System</strong></p>
  <p class="blau">Wir freuen uns sehr, dass Sie ein neues Konto erstellen wollen!</p>
  <hr>

  <h1>Registrieren</h1>

  <label for="email">E-Mail</label>
  <input id="email" type="email" placeholder="beispiel@email.com">

  <label for="password">Passwort</label>
  <input id="password" type="password" placeholder="••••••••">

  <p id="msg" class="rot"></p>

  <button id="signupBtnEINS" class="btn">Registrieren</button>
  <div id="spinner" class="loader" style="display:none;"></div>

  <br><br>
  <a href="logonUI.html">Haben Sie bereits ein Konto? Anmelden!</a>
</div>

<script type="module">
  import { signUp, getSession } from "./auth.js";

  const emailField = document.getElementById("email");
  const passwordField = document.getElementById("password");
  const msg = document.getElementById("msg");
  const signupBtn = document.getElementById("signupBtnEINS");
  const spinner = document.getElementById("spinner");

  signupBtn.addEventListener("click", async () => {
    msg.textContent = "";

    emailField.style.display = "none";
    passwordField.style.display = "none";
    signupBtn.style.display = "none";
    spinner.style.display = "block";

    try {
      await signUp(emailField.value, passwordField.value);
      window.location.href = "BrettWeb2026/auth/signupsucess.html";
    } catch (err) {
      msg.textContent = err.message;
      emailField.style.display = "block";
      passwordField.style.display = "block";
      signupBtn.style.display = "block";
      spinner.style.display = "none";
    }
  });

  (async () => {
    const session = await getSession();
    if (session) window.location.href = "mainpage.html";
  })();
</script>

</body>
</html>
