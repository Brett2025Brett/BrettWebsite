<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BRETT | Dashboard</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">

<style>
* {
  box-sizing: border-box;
}
body, html {
  margin: 0;
  height: 100%;
  font-family: 'Inter', sans-serif;
}
body {
  display: flex;
  background: #0f2027;
}

/* Sidebar */
.sidebar {
  width: 240px;
  background: #111;
  color: white;
  padding: 20px;
  display: flex;
  flex-direction: column;
  gap: 20px;
}
.sidebar h2 {
  margin: 0;
  font-size: 24px;
  color: #00c6ff;
}
.sidebar a {
  text-decoration: none;
  color: white;
  padding: 10px 0;
  font-size: 16px;
  transition: 0.2s;
}
.sidebar a:hover {
  color: #00c6ff;
}

/* Main Content */
.main {
  flex: 1;
  padding: 30px 40px;
  color: white;
}

/* Greeting */
.header {
  font-size: 28px;
  font-weight: 600;
  margin-bottom: 10px;
}
.subheader {
  opacity: 0.8;
  margin-bottom: 30px;
}

/* Cards */
.cards {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
  gap: 20px;
  margin-bottom: 40px;
}
.card {
  background: rgba(255,255,255,0.1);
  border-radius: 16px;
  padding: 20px;
  backdrop-filter: blur(10px);
  box-shadow: 0 10px 20px rgba(0,0,0,0.3);
}
.card h3 {
  margin: 0 0 10px 0;
  font-size: 18px;
  color: #00c6ff;
}
.card p {
  font-size: 14px;
}

/* Downloads Section */
.downloads {
  margin-top: 20px;
}
.downloads h3 {
  font-size: 20px;
  margin-bottom: 15px;
}
.downloads a {
  display: block;
  background: #0072ff;
  color: white;
  padding: 12px;
  border-radius: 10px;
  text-decoration: none;
  margin-bottom: 10px;
  font-weight: 600;
  transition: 0.3s;
}
.downloads a:hover {
  background: #00c6ff;
}

/* Logout */
.logout-btn {
  margin-top: 40px;
  padding: 12px;
  border: none;
  border-radius: 10px;
  background: #ff4b2b;
  color: white;
  font-size: 16px;
  cursor: pointer;
  transition: 0.3s;
}
.logout-btn:hover {
  background: #ff416c;
}
</style>
</head>

<body>

<div class="sidebar">
  <h2>BRETT</h2>
  <a href="#overview">Übersicht</a>
  <a href="#downloads">Downloads</a>
  <a href="#settings">Einstellungen</a>
  <button id="logoutBtnSidebar" class="logout-btn">Logout</button>
</div>

<div class="main">
  <div class="header" id="overview">Dashboard</div>
  <div class="subheader" id="user"></div>

  <!-- Info Cards -->
  <div class="cards">
    <div class="card">
      <h3>Profil</h3>
      <p id="cardEmail"></p>
    </div>
    <div class="card">
      <h3>Status</h3>
      <p>Aktiv & angemeldet</p>
    </div>
    <div class="card">
      <h3>Letzte Aktivität</h3>
      <p>Keine Daten verfügbar</p>
    </div>
  </div>

  <!-- Downloads -->
  <div class="downloads" id="downloads">
    <h3>Verfügbare Downloads</h3>
    <a href="#">BRETTBrowser</a>
    <a href="#">MusikBrett</a>
    <a href="#">Zeichenbrett Pro</a>
    <a href="#">AnimationsBrett</a>
  </div>
</div>

<script type="module">
  import { getSession, logout } from "./auth.js";

  const userEl = document.getElementById("user");
  const emailCard = document.getElementById("cardEmail");

  // Session prüfen
  (async () => {
    const session = await getSession();
    if (!session) {
      window.location.href = "logonUI.html";
      return;
    }
    userEl.textContent = "Eingeloggt als: " + session.user.email;
    emailCard.textContent = session.user.email;
  })();

  document.getElementById("logoutBtnSidebar").onclick = async () => {
    await logout();
    window.location.href = "logonUI.html";
  };
</script>

</body>
</html>
