<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BRETT Ultra Dashboard</title>

<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: "Segoe UI", Arial, sans-serif;
}

body {
  height: 100vh;
  display: flex;
  background: linear-gradient(135deg, #0f172a, #0c0f17, #111827);
  background-size: 400% 400%;
  animation: gradientMove 15s ease infinite;
  color: white;
  overflow: hidden;
}

@keyframes gradientMove {
  0% { background-position: 0% 50%; }
  50% { background-position: 100% 50%; }
  100% { background-position: 0% 50%; }
}

/* ===== SIDEBAR ===== */
.sidebar {
  width: 260px;
  backdrop-filter: blur(20px);
  background: rgba(20, 25, 40, 0.7);
  border-right: 1px solid rgba(255,255,255,0.05);
  padding: 30px 20px;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  transition: 0.3s;
  z-index: 1001;
}

.logo {
  font-size: 22px;
  font-weight: bold;
  margin-bottom: 40px;
  background: linear-gradient(90deg,#00f2ff,#4f46e5);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
}

.nav a {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 14px;
  border-radius: 10px;
  text-decoration: none;
  color: #cbd5e1;
  margin-bottom: 12px;
  transition: 0.3s;
}

.nav a:hover {
  background: rgba(0,242,255,0.1);
  color: #00f2ff;
  transform: translateX(5px);
}

.logout button {
  width: 100%;
  padding: 12px;
  border: none;
  border-radius: 8px;
  background: linear-gradient(90deg,#ff3b3b,#ff0000);
  color: white;
  cursor: pointer;
  transition: 0.3s;
}

.logout button:hover {
  transform: scale(1.05);
}

/* ===== MAIN ===== */
.main {
  flex: 1;
  padding: 40px;
  overflow-y: auto;
}

/* ===== CARDS ===== */
.cards {
  display: grid;
  grid-template-columns: repeat(auto-fit,minmax(240px,1fr));
  gap: 25px;
  margin-bottom: 30px;
}

.card {
  backdrop-filter: blur(15px);
  background: rgba(255,255,255,0.05);
  border-radius: 16px;
  padding: 25px;
  border: 1px solid rgba(255,255,255,0.05);
  transition: 0.3s;
}

.card:hover {
  transform: translateY(-6px);
  box-shadow: 0 10px 40px rgba(0,242,255,0.2);
}

.card h3 {
  margin-bottom: 10px;
  color: #00f2ff;
}

.stat {
  font-size: 30px;
  font-weight: bold;
}

/* Chart Placeholder */
.chart {
  height: 250px;
  margin-top: 15px;
  border-radius: 12px;
  background: linear-gradient(180deg, rgba(0,242,255,0.2), transparent);
  display: flex;
  align-items: flex-end;
  gap: 10px;
  padding: 15px;
}

.bar {
  flex: 1;
  background: linear-gradient(180deg,#00f2ff,#4f46e5);
  border-radius: 6px 6px 0 0;
  transition: 0.3s;
}

.bar:hover {
  opacity: 0.8;
}

/* ===== MOBILE ===== */
.hamburger {
  display: none;
  position: absolute;
  top: 20px;
  left: 20px;
  font-size: 22px;
  cursor: pointer;
  z-index: 1002;
}

.overlay {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.6);
  z-index: 1000;
}

.overlay.active {
  display: block;
}

@media (max-width: 768px) {
  .sidebar {
    position: fixed;
    left: -270px;
    top: 0;
    height: 100%;
  }

  .sidebar.active {
    left: 0;
  }

  .hamburger {
    display: block;
  }

  .main {
    padding: 80px 20px;
  }
}
</style>
</head>

<body>

<div class="hamburger" onclick="toggleMenu()">
  <i class="fas fa-bars"></i>
</div>

<div class="overlay" id="overlay" onclick="toggleMenu()"></div>

<div class="sidebar" id="sidebar">
  <div>
    <div class="logo">BRETT</div>
    <div class="nav">
      <a href="#"><i class="fas fa-home"></i> Home</a>
      <a href="https://brett2025brett.github.io/BrettWebsite/downloadcenter.html">
        <i class="fas fa-download"></i> Downloads
      </a>
      <a href="https://brett2025brett.github.io/BrettWebsite/projects.html">
        <i class="fas fa-folder"></i> Projekte
      </a>
      <a href="https://brett2025brett.github.io/BrettWebsite/account.html">
        <i class="fas fa-user"></i> Account
      </a>
    </div>
  </div>

  <div class="logout">
    <button id="logoutBtn">Logout</button>
  </div>
</div>

<div class="main">
  <h1 style="margin-bottom:30px;">Ultra Premium Dashboard</h1>

  <div class="cards">
    <div class="card">
      <h3>Aktive Projekte</h3>
      <div class="stat" id="projects">0</div>
    </div>

    <div class="card">
      <h3>Downloads</h3>
      <div class="stat" id="downloads">0</div>
    </div>

    <div class="card">
      <h3>System Status</h3>
      <div class="stat">Online</div>
    </div>
  </div>

  <div class="card">
    <h3>Analytics</h3>
    <div class="chart">
      <div class="bar" style="height:40%"></div>
      <div class="bar" style="height:70%"></div>
      <div class="bar" style="height:55%"></div>
      <div class="bar" style="height:90%"></div>
      <div class="bar" style="height:60%"></div>
    </div>
  </div>

  <div class="card">
    <h3>Account</h3>
    <p id="user"></p>
  </div>
</div>

<script type="module">
import { getSession, logout } from "./auth.js";

(async () => {
  const session = await getSession();
  if (!session) {
    window.location.href = "loginUI.html";
    return;
  }
  document.getElementById("user").textContent =
    "Eingeloggt als: " + session.user.email;
})();

document.getElementById("logoutBtn").onclick = async () => {
  await logout();
  window.location.href = "loginUI.html";
};

function animateValue(id, end, duration) {
  let start = 0;
  let current = start;
  let stepTime = Math.abs(Math.floor(duration / end));
  let obj = document.getElementById(id);
  let timer = setInterval(function() {
    current++;
    obj.textContent = current;
    if (current == end) clearInterval(timer);
  }, stepTime);
}

animateValue("projects", 18, 1200);
animateValue("downloads", 512, 1800);

window.toggleMenu = function() {
  document.getElementById("sidebar").classList.toggle("active");
  document.getElementById("overlay").classList.toggle("active");
};
</script>

</body>
</html>
