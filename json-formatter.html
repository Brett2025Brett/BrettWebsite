<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JSON Formatter — BRETT</title>

<link rel="stylesheet" href="style3.css">
<style>
  .tool-panel{
    background:linear-gradient(180deg, var(--char-2), var(--char));
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:32px;
    margin-top:30px;
    max-width:820px;
  }
  .field{ margin-bottom:20px; }
  .field label{
    display:block; font-size:0.82rem; font-weight:600;
    color:var(--ash); margin-bottom:8px; letter-spacing:0.02em;
  }
  textarea{
    width:100%;
    background:var(--void);
    border:1px solid var(--line);
    color:var(--paper);
    font-family:'Courier New', monospace;
    font-size:0.88rem;
    padding:14px;
    border-radius:8px;
    outline:none;
    resize:vertical;
    line-height:1.5;
    transition:border-color .2s ease;
  }
  textarea:focus{ border-color:var(--ember); }
  .tool-btn{
    font-family:'Rajdhani',sans-serif; font-weight:700; font-size:0.95rem;
    letter-spacing:0.02em;
    padding:12px 26px; border-radius:8px; border:none; cursor:pointer;
    color:var(--void);
    background:linear-gradient(135deg, var(--glow), var(--ember));
    box-shadow:0 10px 24px -10px rgba(255,90,31,0.55);
    transition:transform .2s ease;
  }
  .tool-btn:hover{ transform:translateY(-2px); }
  .status{ margin-top:14px; font-size:0.88rem; }
  .status.ok{ color:var(--glow); }
  .status.err{ color:#ff6b6b; }
</style>
</head>
<body>

<header class="top">
  <div class="nav-wrap">
    <div class="brand"><span class="mark">BRETT</span><span class="tag">We know</span></div>
    <nav class="links">
      <a href="mainpage.html">Willkommen</a>
      <a href="downloadcenter_new.html">Downloads</a>
      <a href="Online-tools.html" class="active">Onlinetools</a>
      <a href="Lizenz.html">Lizenz</a>
      <a href="brett-spiele.html">Spiele</a>
    </nav>
  </div>
</header>

<main>
  <a class="back-link" href="Online-tools.html">Zurück zu Onlinetools</a>
  <span class="eyebrow">Onlinetool</span>
  <h1 class="page-title">JSON Formatter</h1>
  <p class="lede">JSON validieren und lesbar formatieren.</p>

  <div class="tool-panel">
    <div class="field">
      <label for="jsonInput">JSON-Eingabe</label>
      <textarea id="jsonInput" rows="10" placeholder='{"beispiel": true, "wert": 42}'></textarea>
    </div>

    <div style="display:flex; gap:12px; flex-wrap:wrap;">
      <button class="tool-btn" onclick="formatJSON()">Formatieren</button>
      <button class="tool-btn" onclick="minifyJSON()">Minifizieren</button>
    </div>

    <p id="status" class="status"></p>

    <div class="field" style="margin-top:20px;">
      <label for="jsonOutput">Ergebnis</label>
      <textarea id="jsonOutput" rows="10" readonly style="resize:none;"></textarea>
    </div>
  </div>
</main>

<script>
  function formatJSON() {
    const input = document.getElementById('jsonInput').value;
    const status = document.getElementById('status');
    try {
      const parsed = JSON.parse(input);
      document.getElementById('jsonOutput').value = JSON.stringify(parsed, null, 2);
      status.textContent = 'Gültiges JSON ✓';
      status.className = 'status ok';
    } catch (e) {
      document.getElementById('jsonOutput').value = '';
      status.textContent = 'Fehler: ' + e.message;
      status.className = 'status err';
    }
  }

  function minifyJSON() {
    const input = document.getElementById('jsonInput').value;
    const status = document.getElementById('status');
    try {
      const parsed = JSON.parse(input);
      document.getElementById('jsonOutput').value = JSON.stringify(parsed);
      status.textContent = 'Gültiges JSON ✓';
      status.className = 'status ok';
    } catch (e) {
      document.getElementById('jsonOutput').value = '';
      status.textContent = 'Fehler: ' + e.message;
      status.className = 'status err';
    }
  }
</script>

</body>
</html>
