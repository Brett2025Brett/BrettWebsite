<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tetris — BRETT Game PRO Session</title>
<link rel="stylesheet" href="style3.css">
<style>
  .game-wrap{ margin-top:26px; text-align:center; }
  canvas{
    background:var(--void); border:1px solid var(--line); border-radius:10px;
    box-shadow:0 20px 50px -20px rgba(255,90,31,0.3);
  }
  .hud{
    display:flex; justify-content:center; gap:30px; margin-bottom:16px;
    font-family:'Rajdhani',sans-serif; font-weight:700; font-size:1.1rem; color:var(--glow);
  }
  .tool-btn{
    font-family:'Rajdhani',sans-serif; font-weight:700; font-size:0.95rem;
    padding:12px 26px; border-radius:8px; border:none; cursor:pointer;
    color:var(--void); background:linear-gradient(135deg, var(--glow), var(--ember));
    box-shadow:0 10px 24px -10px rgba(255,90,31,0.55); margin-top:20px;
    transition:transform .2s ease;
  }
  .tool-btn:hover{ transform:translateY(-2px); }
  .hint{ margin-top:14px; font-size:0.82rem; color:var(--ash-dim); }
</style>
</head>
<body>

<header class="top">
  <div class="nav-wrap">
    <div class="brand"><span class="mark">BRETT</span><span class="tag">We know</span></div>
    <nav class="links">
      <a href="mainpage.html">Willkommen</a>
      <a href="downloadcenter_new.html">Downloads</a>
      <a href="Online-tools.html">Onlinetools</a>
      <a href="Lizenz.html">Lizenz</a>
      <a href="brett-spiele.html" class="active">Spiele</a>
    </nav>
  </div>
</header>

<main>
  <a class="back-link" href="brett-game-pro-session.html">Zurück zur PRO Session</a>
  <span class="eyebrow">Brett Game PRO Session</span>
  <h1 class="page-title">Tetris</h1>
  <p class="lede">Pfeiltasten: bewegen/drehen. Leertaste: Hard-Drop.</p>

  <div class="game-wrap">
    <div class="hud">
      <div>Punkte: <span id="score">0</span></div>
      <div>Level: <span id="level">1</span></div>
    </div>
    <canvas id="game" width="240" height="480"></canvas>
    <br>
    <button class="tool-btn" onclick="resetGame()">Neustart</button>
    <p class="hint"></p>
  </div>
</main>

<script>
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const COLS = 12, ROWS = 24, SIZE = 20;

  const shapes = {
    I: [[1,1,1,1]],
    O: [[1,1],[1,1]],
    T: [[0,1,0],[1,1,1]],
    S: [[0,1,1],[1,1,0]],
    Z: [[1,1,0],[0,1,1]],
    J: [[1,0,0],[1,1,1]],
    L: [[0,0,1],[1,1,1]]
  };
  const colors = { I:'#7de0ff', O:'#ffb44d', T:'#ff5a1f', S:'#7de89a', Z:'#ff6b6b', J:'#a78bfa', L:'#ff9c5c' };

  let grid, current, score, level, dropInterval, dropTimer, gameOver;

  function newPiece() {
    const keys = Object.keys(shapes);
    const type = keys[Math.floor(Math.random() * keys.length)];
    return { type, shape: shapes[type].map(r => r.slice()), x: Math.floor(COLS/2) - 1, y: 0 };
  }

  function resetGame() {
    grid = Array.from({length: ROWS}, () => Array(COLS).fill(null));
    score = 0; level = 1; dropInterval = 600; gameOver = false;
    document.getElementById('score').textContent = score;
    document.getElementById('level').textContent = level;
    current = newPiece();
    if (dropTimer) clearInterval(dropTimer);
    dropTimer = setInterval(drop, dropInterval);
    draw();
  }

  function rotate(shape) {
    const rows = shape.length, cols = shape[0].length;
    const res = Array.from({length: cols}, () => Array(rows).fill(0));
    for (let r = 0; r < rows; r++) for (let c = 0; c < cols; c++) res[c][rows-1-r] = shape[r][c];
    return res;
  }

  function collides(shape, x, y) {
    for (let r = 0; r < shape.length; r++) {
      for (let c = 0; c < shape[r].length; c++) {
        if (!shape[r][c]) continue;
        const nx = x + c, ny = y + r;
        if (nx < 0 || nx >= COLS || ny >= ROWS) return true;
        if (ny >= 0 && grid[ny][nx]) return true;
      }
    }
    return false;
  }

  function merge() {
    current.shape.forEach((row, r) => row.forEach((v, c) => {
      if (v) {
        const ny = current.y + r, nx = current.x + c;
        if (ny >= 0) grid[ny][nx] = current.type;
      }
    }));
  }

  function clearLines() {
    let cleared = 0;
    for (let r = ROWS - 1; r >= 0; r--) {
      if (grid[r].every(c => c)) {
        grid.splice(r, 1);
        grid.unshift(Array(COLS).fill(null));
        cleared++;
        r++;
      }
    }
    if (cleared) {
      score += [0, 100, 300, 500, 800][cleared] || cleared * 200;
      document.getElementById('score').textContent = score;
      level = Math.floor(score / 1000) + 1;
      document.getElementById('level').textContent = level;
      dropInterval = Math.max(120, 600 - (level - 1) * 50);
      clearInterval(dropTimer);
      dropTimer = setInterval(drop, dropInterval);
    }
  }

  function drop() {
    if (gameOver) return;
    if (!collides(current.shape, current.x, current.y + 1)) {
      current.y++;
    } else {
      merge();
      clearLines();
      current = newPiece();
      if (collides(current.shape, current.x, current.y)) {
        gameOver = true;
        clearInterval(dropTimer);
      }
    }
    draw();
  }

  function hardDrop() {
    if (gameOver) return;
    while (!collides(current.shape, current.x, current.y + 1)) current.y++;
    drop();
  }

  function draw() {
    ctx.fillStyle = '#0c0906';
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    for (let r = 0; r < ROWS; r++) {
      for (let c = 0; c < COLS; c++) {
        if (grid[r][c]) {
          ctx.fillStyle = colors[grid[r][c]];
          ctx.fillRect(c * SIZE, r * SIZE, SIZE - 1, SIZE - 1);
        }
      }
    }

    ctx.fillStyle = colors[current.type];
    current.shape.forEach((row, r) => row.forEach((v, c) => {
      if (v) ctx.fillRect((current.x + c) * SIZE, (current.y + r) * SIZE, SIZE - 1, SIZE - 1);
    }));

    if (gameOver) {
      ctx.fillStyle = 'rgba(12,9,6,0.75)';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = '#ffb44d';
      ctx.font = 'bold 24px Rajdhani, sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText('Game Over', canvas.width/2, canvas.height/2);
    }
  }

  document.addEventListener('keydown', e => {
    if (gameOver) return;
    if (e.key === 'ArrowLeft' && !collides(current.shape, current.x - 1, current.y)) { current.x--; draw(); }
    else if (e.key === 'ArrowRight' && !collides(current.shape, current.x + 1, current.y)) { current.x++; draw(); }
    else if (e.key === 'ArrowDown') { drop(); }
    else if (e.key === 'ArrowUp') {
      const rotated = rotate(current.shape);
      if (!collides(rotated, current.x, current.y)) { current.shape = rotated; draw(); }
    } else if (e.key === ' ') { e.preventDefault(); hardDrop(); }
  });

  resetGame();
</script>

</body>
</html>
