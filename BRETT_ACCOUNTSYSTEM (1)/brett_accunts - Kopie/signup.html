<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BRETT | Registrierung</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">

<style>
* { box-sizing: border-box; }

html, body {
  height: 100%;
  margin: 0;
  font-family: 'Inter', sans-serif;
}

body {
  display: flex;
  justify-content: center;
  align-items: center;
  background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
}

.box {
  width: 420px;
  padding: 40px;
  border-radius: 18px;
  backdrop-filter: blur(20px);
  background: rgba(255,255,255,0.08);
  border: 1px solid rgba(255,255,255,0.15);
  box-shadow: 0 20px 40px rgba(0,0,0,0.4);
  color: white;
  animation: fadeIn 0.6s ease;
}

@keyframes fadeIn {
  from {opacity:0; transform: translateY(20px);}
  to {opacity:1; transform: translateY(0);}
}

h1 { margin: 0 0 10px 0; font-weight: 600; }

p { margin: 5px 0; }

hr {
  border: none;
  height: 1px;
  background: rgba(255,255,255,0.2);
  margin: 20px 0;
}

label { font-size: 14px; opacity: 0.8; }

input {
  width: 100%;
  padding: 12px;
  margin-top: 6px;
  margin-bottom: 18px;
  border-radius: 10px;
  border: none;
  outline: none;
  background: rgba(255,255,255,0.15);
  color: white;
  font-size: 14px;
}

.btn {
  width: 100%;
  padding: 12px;
  border-radius: 12px;
  border: none;
  font-size: 15px;
  font-weight: 600;
  cursor: pointer;
  background: linear-gradient(135deg, #00c6ff, #0072ff);
  color: white;
}

.newsletter {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 18px;
  font-size: 14px;
}

.loader {
  border: 5px solid rgba(255,255,255,0.2);
  border-top: 5px solid #00c6ff;
  border-radius: 50%;
  width: 40px;
  height: 40px;
  margin: 15px auto;
  animation: spin 1s linear infinite;
}

@keyframes spin {
  0% { transform: rotate(0deg);}
  100% { transform: rotate(360deg);}
}
</style>
</head>

<body>

<div class="box">
<p><strong>BRETT Login-System</strong></p>
<hr>

<h1>Registrieren</h1>

<label for="email">E-Mail</label>
<input id="email" type="email" placeholder="beispiel@email.com">

<label for="password">Passwort</label>
<input id="password" type="password" placeholder="••••••••">

<div class="newsletter">
<input type="checkbox" id="newsletter">
<label for="newsletter">Für Newsletter anmelden</label>
</div>

<p id="msg"></p>

<button id="signupBtnEINS" class="btn">Registrieren</button>
<div id="spinner" class="loader" style="display:none;"></div>

</div>

<script type="module">
import { signUp, getSession } from "./auth.js";

const emailField = document.getElementById("email");
const passwordField = document.getElementById("password");
const newsletter = document.getElementById("newsletter");

const msg = document.getElementById("msg");
const signupBtn = document.getElementById("signupBtnEINS");
const spinner = document.getElementById("spinner");

signupBtn.addEventListener("click", async () => {

msg.textContent = "";

emailField.style.display = "none";
passwordField.style.display = "none";
signupBtn.style.display = "none";
spinner.style.display = "block";

try {

await signUp(emailField.value, passwordField.value);

if(newsletter.checked){

fetch("BRETT_ACCOUNTSYSTEM (1)/brett_accunts - Kopie/newsletter.php",{
method:"POST",
headers:{'Content-Type':'application/json'},
body:JSON.stringify({
email:emailField.value
})
});

}

window.location.href = "signupsucess.html";

} catch (err) {

msg.textContent = err.message;

emailField.style.display = "block";
passwordField.style.display = "block";
signupBtn.style.display = "block";
spinner.style.display = "none";

}

});

(async () => {
const session = await getSession();
if (session) window.location.href = "dashboard.html";
})();
</script>

</body>
</html>
