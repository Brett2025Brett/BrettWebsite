<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>BRETT Dashboard</title>
<style>
body {
  font-family: Arial;
  margin: 0;
  display: flex;
}
.sidebar {
  width: 220px;
  background: #333;
  color: white;
  height: 100vh;
  padding: 20px;
}
.sidebar button {
  width: 100%;
  padding: 10px;
  margin-bottom: 10px;
  background: #ff7043;
  border: none;
  color: white;
  cursor: pointer;
}
.main {
  flex: 1;
  padding: 40px;
}
</style>
</head>
<body>

<div class="sidebar">
  <button onclick="go('downloadcenter.html')">Downloadcenter</button>
  <button onclick="go('Online-tools.html')">Online Tools</button>
  <button onclick="go('Lizenz.html')">Lizenz</button>
  <button onclick="logout()">Logout</button>
</div>

<div class="main">
  <h1>Willkommen im Dashboard</h1>
</div>

<script>
function go(page) {
  window.location.href = "/BrettWebsite/" + page;
}

function logout() {
  window.location.href = "/BrettWebsite/logonUI.html";
}
</script>

</body>
</html>
