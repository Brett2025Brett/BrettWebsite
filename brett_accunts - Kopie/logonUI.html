<html>
<style>
html, body {
  height: 100%;
  margin: 0;
}
body {
  font-family: "Arial", sans-serif;
  display: flex;
  justify-content: center;
  align-items: center;
}

.box {
  width: 400px;
  padding: 20px;
  border: 1px solid #333;
  background-color: #f5f5f5;
}
.rot { color: red; }
.blau { color: blue; }
.gruen { color: green; }
.orangefarbig { color: orange; }

.btn {
  background: #00aaff;
  color: white;
  border: none;
  padding: 8px 12px;
  border-radius: 4px;
  cursor: pointer;
  font-size: 14px;
}
loader {
  border: 6px solid #f3f3f3;
  border-top: 6px solid #3498db;
  border-radius: 50%;
  width: 40px;
  height: 40px;
  margin: 10px auto;
  animation: spin 1s linear infinite;
}

@keyframes spin {
  0% { transform: rotate(0deg); }
  100% { transform: rotate(360deg); }
}


 .navbar {
      background-color: #333;
      overflow: hidden;
      display: flex;
      padding: 10px;
    }
   body {
      background-color: #f9f9f9;
      font-family: 'Arial', sans-serif;
      margin: 0;
      padding: 0;
      color: #333;
      line-height: 1.6;
      transition: background-color 0.3s, color 0.3s;
    }

    header {
      text-align: center;
      padding: 50px 0;
      background-color: #ff7043;
      color: white;
      border-bottom: 4px solid #e64a19;
    }

    header h1 {
      font-size: 3.5rem;
      margin: 0;
      font-weight: 700;
    }

    header p {
      font-size: 1.3rem;
      margin-top: 15px;
      font-weight: 300;
    }

    .container {
      width: 85%;
      max-width: 1200px;
      margin: 40px auto;
      padding: 30px;
      background-color: #ffffff;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
      border-radius: 10px;
    }

    .download-section {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 20px;
      margin-top: 20px;
    }

    .download-button {
      padding: 15px 30px;
      background-color: #ff7043;
      color: white;
      font-size: 1rem;
      border: none;
      border-radius: 50px;
      cursor: pointer;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
      transition: all 0.3s ease;
    }

    .download-button:hover {
      background-color: #e64a19;
      transform: scale(1.05);
    }

    iframe {
      display: block;
      margin: 40px auto;
      border-radius: 10px;
    }

    .rating-section {
      display: flex;
      justify-content: center;
      gap: 10px;
      margin-top: 30px;
    }

    .star {
      font-size: 2rem;
      color: #ff7043;
      cursor: pointer;
      transition: transform 0.2s;
    }

    .star:hover {
      transform: scale(1.2);
    }

    .countdown {
      font-size: 1.5rem;
      background-color: #e64a19;
      color: white;
      padding: 15px 30px;
      border-radius: 8px;
      text-align: center;
      margin-top: 50px;
    }

    #timer {
      font-size: 2rem;
      margin-top: 10px;
    }

    .dark-mode-toggle {
      position: fixed;
      top: 20px;
      right: 20px;
      padding: 10px;
      background-color: #ff7043;
      border-radius: 50%;
      cursor: pointer;
      color: white;
      font-size: 1.5rem;
      z-index: 1000;
    }

    body.dark-mode {
      background-color: #333;
      color: #f9f9f9;
    }

    body.dark-mode header {
      background-color: #212121;
    }

    body.dark-mode .container {
      background-color: #444;
    }

    footer {
      text-align: center;
      padding: 20px 0;
      background-color: #333;
      color: white;
      margin-top: 60px;
    }

    footer p {
      font-size: 0.9rem;
      margin: 0;
    }

    .info-box {
      display: flex;
      justify-content: center;
      gap: 40px;
      margin-top: 30px;
      flex-wrap: wrap;
    }

    .info-box img {
      width: 150px;
      height: 190px;
      object-fit: cover;
      border-radius: 10px;
      transition: transform 0.3s ease;
    }

    .info-box img:hover {
      transform: scale(1.05);
    }
    .styled-button:hover {
      background: #e64a19;
      box-shadow: 0 6px 12px rgba(0, 0, 0, 0.4);
      transform: scale(1.05);
    }
    .login-btn {
  position: fixed;        /* bleibt oben rechts */

  padding: 12px;
  border-radius: 50%;
  text-decoration: none;

  box-shadow: 0 4px 10px rgba(0,0,0,0.3);
}

.login-btn:hover {

  transform: scale(1.1);
}
  </style>

</head>

  <div class="box">
  <p class="gruen">BRETT Login-System</p>
  <p class="blau">Willkommen zurück!</p>
  <hr>

  <h1 class="blau">Anmelden</h1>

  <label for="email">E-Mail:</label>
  <input id="email" type="email"><br>

  <label for="password">Passwort:</label>
  <input id="password" type="password"><br><br>

  <p id="msg" class="rot"></p>

  <button id="loginBtn" class="btn">Anmelden</button>
  <div id="spinner" class="loader" style="display:none;"></div>


  <br>
  <a href="signup.html" class="orangefarbig">Noch kein Konto? Ein neues erstellen!</a>
</div>

<script type="module">
  import { login, getSession } from "./auth.js";

  const email = document.getElementById("email");
  const password = document.getElementById("password");
  const msg = document.getElementById("msg");
  const loginBtn = document.getElementById("loginBtn");
const emailField = document.getElementById("email");
const passwordField = document.getElementById("password");
const spinner = document.getElementById("spinner");


  async function loadLoginRegisterData() {
  msg.textContent = "";

  // Eingabefelder + Button ausblenden
  emailField.style.display = "none";
  passwordField.style.display = "none";
  loginBtn.style.display = "none";

  // Spinner anzeigen
  spinner.style.display = "block";

  try {
    await login(emailField.value, passwordField.value);
    msg.textContent = "Login erfolgreich. Weiterleitung...";
    setTimeout(() => window.location.href = "dashboard.html", 1000);
  } catch (err) {
    msg.textContent = err.message;

    // Bei Fehler wieder anzeigen
    emailField.style.display = "block";
    passwordField.style.display = "block";
    loginBtn.style.display = "block";
    spinner.style.display = "none";
  }
}


  // Event Listener statt onclick
  loginBtn.addEventListener("click", loadLoginRegisterData);

  // Automatische Weiterleitung, falls Session existiert
  (async () => {
    const session = await getSession();
    if (session) window.location.href = "dashboard.html";
  })();
</script>
