<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Schach gegen KI — BRETT Game PRO Session</title>
<link rel="stylesheet" href="style3.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
<style>
  .game-wrap{ margin-top:26px; text-align:center; }
  .board{
    display:grid; grid-template-columns:repeat(8, 56px); grid-template-rows:repeat(8, 56px);
    margin:0 auto; width:fit-content; border:2px solid var(--line); border-radius:8px; overflow:hidden;
  }
  .sq{
    display:flex; align-items:center; justify-content:center;
    font-size:2.1rem; cursor:pointer; position:relative; user-select:none;
  }
  .sq.light{ background:#e9d5c0; }
  .sq.dark{ background:#8a5a3c; }
  .sq.selected{ outline:3px solid #ff5a1f; outline-offset:-3px; }
  .sq.movable::after{
    content:""; position:absolute; width:16px; height:16px; border-radius:50%;
    background:rgba(255,90,31,0.55);
  }
  .hud{
    display:flex; justify-content:center; gap:24px; margin-bottom:16px; flex-wrap:wrap;
    font-family:'Rajdhani',sans-serif; font-weight:700; font-size:1rem; color:var(--glow);
  }
  select.diff{
    background:var(--void); border:1px solid var(--line); color:var(--paper);
    padding:8px 12px; border-radius:8px; font-family:'Inter',sans-serif; font-size:0.85rem;
  }
  .tool-btn{
    font-family:'Rajdhani',sans-serif; font-weight:700; font-size:0.95rem;
    padding:12px 26px; border-radius:8px; border:none; cursor:pointer;
    color:var(--void); background:linear-gradient(135deg, var(--glow), var(--ember));
    box-shadow:0 10px 24px -10px rgba(255,90,31,0.55); margin-top:20px;
    transition:transform .2s ease;
  }
  .tool-btn:hover{ transform:translateY(-2px); }
  #status{ margin-top:16px; font-family:'Rajdhani',sans-serif; font-weight:700; color:var(--glow); min-height:1.4em; }
</style>
</head>
<body>

<header class="top">
  <div class="nav-wrap">
    <div class="brand"><span class="mark">BRETT</span><span class="tag">We know</span></div>
    <nav class="links">
      <a href="mainpage.html">Willkommen</a>
      <a href="downloadcenter_new.html">Downloads</a>
      <a href="Online-tools.html">Onlinetools</a>
      <a href="Lizenz.html">Lizenz</a>
      <a href="brett-spiele.html" class="active">Spiele</a>
    </nav>
  </div>
</header>

<main>
  <a class="back-link" href="brett-game-pro-session.html">Zurück zur PRO Session</a>
  <span class="eyebrow">Brett Game PRO Session</span>
  <h1 class="page-title">Schach gegen KI</h1>
  <p class="lede">Du spielst Weiß. Feld anklicken zum Ziehen. Die KI nutzt Minimax mit Bewertungsfunktion.</p>

  <div class="game-wrap">
    <div class="hud">
      <span>Schwierigkeit:
        <select class="diff" id="difficulty">
          <option value="1">Leicht</option>
          <option value="2" selected>Mittel</option>
          <option value="3">Schwer</option>
        </select>
      </span>
    </div>
    <div class="board" id="board"></div>
    <p id="status">Du bist dran (Weiß)</p>
    <button class="tool-btn" onclick="resetGame()">Neustart</button>
  </div>
</main>

<script>
  const pieceUnicode = {
    p: '♟', r: '♜', n: '♞', b: '♝', q: '♛', k: '♚',
    P: '♙', R: '♖', N: '♘', B: '♗', Q: '♕', K: '♔'
  };
  const values = { p: 100, n: 320, b: 330, r: 500, q: 900, k: 20000 };

  let game, selected, legalTargets, gameOver;
  const boardEl = document.getElementById('board');
  const statusEl = document.getElementById('status');

  function resetGame() {
    game = new Chess();
    selected = null;
    legalTargets = [];
    gameOver = false;
    statusEl.textContent = 'Du bist dran (Weiß)';
    render();
  }

  function render() {
    boardEl.innerHTML = '';
    const board = game.board();
    for (let r = 0; r < 8; r++) {
      for (let c = 0; c < 8; c++) {
        const file = 'abcdefgh'[c];
        const rank = 8 - r;
        const square = file + rank;
        const piece = board[r][c];
        const sqDiv = document.createElement('div');
        sqDiv.className = 'sq ' + ((r + c) % 2 === 0 ? 'light' : 'dark');
        if (selected === square) sqDiv.classList.add('selected');
        if (legalTargets.includes(square)) sqDiv.classList.add('movable');
        if (piece) {
          const symbol = piece.color === 'w' ? piece.type.toUpperCase() : piece.type;
          sqDiv.textContent = pieceUnicode[symbol];
          sqDiv.style.color = piece.color === 'w' ? '#f5ede4' : '#1a1008';
        }
        sqDiv.onclick = () => onSquareClick(square);
        boardEl.appendChild(sqDiv);
      }
    }
  }

  function onSquareClick(square) {
    if (gameOver || game.turn() !== 'w') return;

    if (selected && legalTargets.includes(square)) {
      game.move({ from: selected, to: square, promotion: 'q' });
      selected = null; legalTargets = [];
      render();
      checkEnd();
      if (!gameOver) {
        statusEl.textContent = 'KI denkt...';
        setTimeout(aiMove, 250);
      }
      return;
    }

    const piece = game.get(square);
    if (piece && piece.color === 'w') {
      selected = square;
      legalTargets = game.moves({ square, verbose: true }).map(m => m.to);
    } else {
      selected = null; legalTargets = [];
    }
    render();
  }

  function evaluateBoard() {
    let score = 0;
    game.board().forEach(row => row.forEach(p => {
      if (!p) return;
      const v = values[p.type];
      score += p.color === 'w' ? v : -v;
    }));
    return score;
  }

  function minimax(depth, alpha, beta, maximizing) {
    if (depth === 0 || game.game_over()) return evaluateBoard();

    const moves = game.moves();
    if (maximizing) {
      let best = -Infinity;
      for (const m of moves) {
        game.move(m);
        best = Math.max(best, minimax(depth - 1, alpha, beta, false));
        game.undo();
        alpha = Math.max(alpha, best);
        if (beta <= alpha) break;
      }
      return best;
    } else {
      let best = Infinity;
      for (const m of moves) {
        game.move(m);
        best = Math.min(best, minimax(depth - 1, alpha, beta, true));
        game.undo();
        beta = Math.min(beta, best);
        if (beta <= alpha) break;
      }
      return best;
    }
  }

  function aiMove() {
    if (gameOver) return;
    const depth = parseInt(document.getElementById('difficulty').value);
    const moves = game.moves();
    let bestMove = null, bestScore = Infinity;

    for (const m of moves) {
      game.move(m);
      const score = minimax(depth - 1, -Infinity, Infinity, true);
      game.undo();
      if (score < bestScore) { bestScore = score; bestMove = m; }
    }

    if (bestMove) game.move(bestMove);
    render();
    checkEnd();
    if (!gameOver) statusEl.textContent = 'Du bist dran (Weiß)';
  }

  function checkEnd() {
    if (game.in_checkmate()) {
      gameOver = true;
      statusEl.textContent = (game.turn() === 'w' ? 'Schachmatt — KI gewinnt.' : 'Schachmatt — Du gewinnst!');
    } else if (game.in_draw() || game.in_stalemate() || game.in_threefold_repetition()) {
      gameOver = true;
      statusEl.textContent = 'Unentschieden.';
    } else if (game.in_check()) {
      statusEl.textContent = (game.turn() === 'w' ? 'Du stehst im Schach!' : 'KI steht im Schach.');
    }
  }

  resetGame();
</script>

</body>
</html>
