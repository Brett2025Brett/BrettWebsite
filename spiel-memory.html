<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Memory — BRETT Game PRO Session</title>
<link rel="stylesheet" href="style3.css">
<style>
  .game-wrap{ margin-top:26px; text-align:center; }
  .board{
    display:grid; grid-template-columns:repeat(4, 90px); gap:10px;
    margin:0 auto; width:fit-content;
  }
  .card{
    width:90px; height:90px; border-radius:10px; cursor:pointer;
    background:linear-gradient(135deg, var(--char-2), var(--char));
    border:1px solid var(--line);
    display:flex; align-items:center; justify-content:center;
    font-size:2.2rem;
    transition:transform .2s ease;
    user-select:none;
  }
  .card.flipped, .card.matched{
    background:linear-gradient(135deg, var(--glow), var(--ember));
  }
  .card.matched{ opacity:0.5; }
  .hud{
    display:flex; justify-content:center; gap:30px; margin-bottom:16px;
    font-family:'Rajdhani',sans-serif; font-weight:700; font-size:1.1rem; color:var(--glow);
  }
  .tool-btn{
    font-family:'Rajdhani',sans-serif; font-weight:700; font-size:0.95rem;
    padding:12px 26px; border-radius:8px; border:none; cursor:pointer;
    color:var(--void); background:linear-gradient(135deg, var(--glow), var(--ember));
    box-shadow:0 10px 24px -10px rgba(255,90,31,0.55); margin-top:20px;
    transition:transform .2s ease;
  }
  .tool-btn:hover{ transform:translateY(-2px); }
</style>
</head>
<body>

<header class="top">
  <div class="nav-wrap">
    <div class="brand"><span class="mark">BRETT</span><span class="tag">We know</span></div>
    <nav class="links">
      <a href="mainpage.html">Willkommen</a>
      <a href="downloadcenter_new.html">Downloads</a>
      <a href="Online-tools.html">Onlinetools</a>
      <a href="Lizenz.html">Lizenz</a>
      <a href="brett-spiele.html" class="active">Spiele</a>
    </nav>
  </div>
</header>

<main>
  <a class="back-link" href="brett-game-pro-session.html">Zurück zur PRO Session</a>
  <span class="eyebrow">Brett Game PRO Session</span>
  <h1 class="page-title">Memory</h1>
  <p class="lede">Finde alle Paare mit den wenigsten Zügen.</p>

  <div class="game-wrap">
    <div class="hud">
      <div>Züge: <span id="moves">0</span></div>
      <div>Paare: <span id="pairs">0</span>/8</div>
    </div>
    <div class="board" id="board"></div>
    <button class="tool-btn" onclick="resetGame()">Neustart</button>
  </div>
</main>

<script>
  const emojis = ['🎮','🎲','🎯','🎨','🎧','⚽','🚀','⭐'];
  let cards, flipped, matched, moves, locked;
  const boardEl = document.getElementById('board');

  function shuffle(arr) {
    for (let i = arr.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    return arr;
  }

  function resetGame() {
    cards = shuffle([...emojis, ...emojis]);
    flipped = [];
    matched = new Set();
    moves = 0;
    locked = false;
    document.getElementById('moves').textContent = moves;
    document.getElementById('pairs').textContent = 0;
    render();
  }

  function render() {
    boardEl.innerHTML = '';
    cards.forEach((emoji, i) => {
      const card = document.createElement('div');
      const isFlipped = flipped.includes(i) || matched.has(i);
      card.className = 'card' + (matched.has(i) ? ' matched' : flipped.includes(i) ? ' flipped' : '');
      card.textContent = isFlipped ? emoji : '';
      card.onclick = () => flipCard(i);
      boardEl.appendChild(card);
    });
  }

  function flipCard(i) {
    if (locked || flipped.includes(i) || matched.has(i)) return;
    flipped.push(i);
    render();
    if (flipped.length === 2) {
      moves++;
      document.getElementById('moves').textContent = moves;
      locked = true;
      const [a, b] = flipped;
      if (cards[a] === cards[b]) {
        matched.add(a); matched.add(b);
        document.getElementById('pairs').textContent = matched.size / 2;
        flipped = [];
        locked = false;
        render();
      } else {
        setTimeout(() => {
          flipped = [];
          locked = false;
          render();
        }, 700);
      }
    }
  }

  resetGame();
</script>

</body>
</html>
