<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BRETT Login</title>
<style>
/* Grundlayout */
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: Arial, sans-serif;
  background: linear-gradient(135deg, #00aaff, #0055aa);
  display: flex; justify-content: center; align-items: center; height: 100vh;
  color: #333;
}

/* Box */
.box {
  width: 400px;
  padding: 40px;
  background-color: #fff;
  border-radius: 12px;
  box-shadow: 0 8px 20px rgba(0,0,0,0.25);
  text-align: center;
}

/* Titel */
p.gruen { color: #00aa55; font-weight: bold; font-size: 18px; }
p.blau { color: #0077cc; font-size: 16px; }
h1 { color: #0077cc; margin: 20px 0; font-size: 28px; }

/* Inputs */
input[type="email"], input[type="password"] {
  width: 100%; padding: 12px; margin: 10px 0 20px 0;
  border: 1px solid #ccc; border-radius: 6px; font-size: 16px;
  transition: border 0.3s ease;
}
input:focus { border-color: #00aaff; outline: none; }

/* Button */
.btn {
  width: 100%; padding: 12px; border: none; border-radius: 6px;
  background: #00aaff; color: white; font-size: 16px; cursor: pointer;
  transition: background 0.3s ease;
}
.btn:hover { background: #0088cc; }

/* Loader */
.loader {
  border: 6px solid #f3f3f3; border-top: 6px solid #3498db;
  border-radius: 50%; width: 40px; height: 40px;
  margin: 20px auto; display: none; animation: spin 1s linear infinite;
}
@keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

/* Meldungen */
#msg { font-weight: bold; margin-bottom: 15px; min-height: 20px; }

/* Link */
a.orangefarbig { color: #ff8800; display: block; margin-top: 20px; text-decoration: none; font-weight: bold; }
a.orangefarbig:hover { text-decoration: underline; }
</style>
</head>
<body>

<div class="box">
  <p class="gruen">BRETT Login-System</p>
  <p class="blau">Willkommen zurück!</p>
  <hr>
  <h1>Anmelden</h1>

  <input id="emailField" type="email" placeholder="E-Mail">
  <input id="passwordField" type="password" placeholder="Passwort">

  <p id="msg" class="rot"></p>

  <button id="loginBtn" class="btn">Anmelden</button>
  <div id="spinner" class="loader"></div>

  <a href="signup.html" class="orangefarbig">Noch kein Konto? Ein neues erstellen!</a>
</div>

<script type="module">
import { login, getSession } from "./auth.js";

const emailField = document.getElementById("emailField");
const passwordField = document.getElementById("passwordField");
const loginBtn = document.getElementById("loginBtn");
const spinner = document.getElementById("spinner");
const msg = document.getElementById("msg");

async function handleLogin() {
  msg.textContent = "";
  emailField.style.display = "none";
  passwordField.style.display = "none";
  loginBtn.style.display = "none";
  spinner.style.display = "block";

  try {
    await login(emailField.value, passwordField.value);
    msg.textContent = "Login erfolgreich. Weiterleitung...";
    setTimeout(() => window.location.href = "dashboard.html", 1000);
  } catch (err) {
    msg.textContent = err.message;
    emailField.style.display = "block";
    passwordField.style.display = "block";
    loginBtn.style.display = "block";
    spinner.style.display = "none";
  }
}

// Event Listener
loginBtn.addEventListener("click", handleLogin);

// Automatische Weiterleitung, falls Session existiert
(async () => {
  const session = await getSession();
  if (session) window.location.href = "dashboard.html";
})();
</script>

</body>
</html>
