<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BRETT | Registrierung erfolgreich</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">

<style>
* {
  box-sizing: border-box;
}

html, body {
  height: 100%;
  margin: 0;
  font-family: 'Inter', sans-serif;
}

body {
  display: flex;
  justify-content: center;
  align-items: center;
  background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
}

/* Card */
.box {
  width: 420px;
  padding: 40px;
  border-radius: 18px;
  backdrop-filter: blur(20px);
  background: rgba(255,255,255,0.08);
  border: 1px solid rgba(255,255,255,0.15);
  box-shadow: 0 20px 40px rgba(0,0,0,0.4);
  color: white;
  text-align: center;
  animation: fadeIn 0.6s ease;
}

@keyframes fadeIn {
  from {opacity:0; transform: translateY(20px);}
  to {opacity:1; transform: translateY(0);}
}

h1 {
  margin: 10px 0 20px 0;
  font-weight: 600;
}

p {
  margin: 8px 0;
  line-height: 1.6;
}

hr {
  border: none;
  height: 1px;
  background: rgba(255,255,255,0.2);
  margin: 20px 0;
}

/* Farben */
.rot { color: #ff6b6b; }
.blau { color: #4fc3f7; }
.gruen { color: #4caf50; }
.orangefarbig { color: #ffa726; }

/* Success Icon */
.success-icon {
  font-size: 60px;
  margin-bottom: 15px;
  color: #4caf50;
  animation: pop 0.5s ease;
}

@keyframes pop {
  0% { transform: scale(0.6); opacity: 0; }
  100% { transform: scale(1); opacity: 1; }
}

/* Link Button */
a {
  display: inline-block;
  margin-top: 20px;
  padding: 12px 20px;
  border-radius: 12px;
  text-decoration: none;
  font-weight: 600;
  background: linear-gradient(135deg, #00c6ff, #0072ff);
  color: white;
  transition: 0.3s;
}

a:hover {
  transform: translateY(-2px);
  box-shadow: 0 8px 20px rgba(0, 114, 255, 0.4);
}
</style>
</head>

<body>

<div class="box">
  <div class="success-icon">✔</div>

  <p class="gruen"><strong>BRETT Login-System</strong></p>
  <hr>

  <h1>Registrierung erfolgreich</h1>

  <p>
Wir freuen uns sehr, sie als neuen Kunden begrüßen zu dürfen!
    Die Registrierung wurde erfolgreich abgeschlossen.<br>
    Wir haben Ihnen eine E-Mail zugesandt, in der Sie Ihre Adresse bestätigen können.
  </p>

  <p><strong>Vielen Dank!</strong></p>

  <a href="login.html">Zurück zur Anmeldeseite</a>
</div>

</body>
</html>
