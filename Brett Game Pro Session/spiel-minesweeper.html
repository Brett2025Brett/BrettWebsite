<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Minesweeper — BRETT Game PRO Session</title>
<link rel="stylesheet" href="style3.css">
<style>
  .game-wrap{ margin-top:26px; text-align:center; }
  .board{
    display:grid; grid-template-columns:repeat(10, 32px); gap:3px;
    margin:0 auto; width:fit-content;
  }
  .cell{
    width:32px; height:32px; border-radius:5px;
    background:var(--char-2); border:1px solid var(--line);
    display:flex; align-items:center; justify-content:center;
    font-family:'Rajdhani',sans-serif; font-weight:700; font-size:1rem;
    cursor:pointer; user-select:none;
  }
  .cell.revealed{ background:var(--void); cursor:default; }
  .cell.mine{ background:#ff5a1f; }
  .cell.flag{ color:var(--glow); }
  .hud{
    display:flex; justify-content:center; gap:30px; margin-bottom:16px;
    font-family:'Rajdhani',sans-serif; font-weight:700; font-size:1.1rem; color:var(--glow);
  }
  .tool-btn{
    font-family:'Rajdhani',sans-serif; font-weight:700; font-size:0.95rem;
    padding:12px 26px; border-radius:8px; border:none; cursor:pointer;
    color:var(--void); background:linear-gradient(135deg, var(--glow), var(--ember));
    box-shadow:0 10px 24px -10px rgba(255,90,31,0.55); margin-top:20px;
    transition:transform .2s ease;
  }
  .tool-btn:hover{ transform:translateY(-2px); }
  .hint{ margin-top:14px; font-size:0.82rem; color:var(--ash-dim); }
  #status{ margin-top:16px; font-family:'Rajdhani',sans-serif; font-weight:700; color:var(--glow); min-height:1.4em; }
</style>
</head>
<body>

<header class="top">
  <div class="nav-wrap">
    <div class="brand"><span class="mark">BRETT</span><span class="tag">We know</span></div>
    <nav class="links">
      <a href="mainpage.html">Willkommen</a>
      <a href="downloadcenter_new.html">Downloads</a>
      <a href="Online-tools.html">Onlinetools</a>
      <a href="Lizenz.html">Lizenz</a>
      <a href="brett-spiele.html" class="active">Spiele</a>
    </nav>
  </div>
</header>

<main>
  <a class="back-link" href="brett-game-pro-session.html">Zurück zur PRO Session</a>
  <span class="eyebrow">Brett Game PRO Session</span>
  <h1 class="page-title">Minesweeper</h1>
  <p class="lede">Linksklick: aufdecken. Rechtsklick: Flagge setzen.</p>

  <div class="game-wrap">
    <div class="hud">
      <div>Minen: <span id="mineCount">15</span></div>
    </div>
    <div class="board" id="board"></div>
    <p id="status"></p>
    <button class="tool-btn" onclick="resetGame()">Neustart</button>
  </div>
</main>

<script>
  const ROWS = 10, COLS = 10, MINES = 15;
  let grid, revealedCount, gameOver;
  const boardEl = document.getElementById('board');
  const statusEl = document.getElementById('status');

  function resetGame() {
    gameOver = false;
    revealedCount = 0;
    statusEl.textContent = '';
    document.getElementById('mineCount').textContent = MINES;
    grid = Array.from({length: ROWS}, () => Array.from({length: COLS}, () => ({
      mine: false, revealed: false, flagged: false, count: 0
    })));

    let placed = 0;
    while (placed < MINES) {
      const r = Math.floor(Math.random() * ROWS);
      const c = Math.floor(Math.random() * COLS);
      if (!grid[r][c].mine) { grid[r][c].mine = true; placed++; }
    }

    for (let r = 0; r < ROWS; r++) {
      for (let c = 0; c < COLS; c++) {
        if (grid[r][c].mine) continue;
        let count = 0;
        for (let dr = -1; dr <= 1; dr++) {
          for (let dc = -1; dc <= 1; dc++) {
            const nr = r + dr, nc = c + dc;
            if (nr >= 0 && nr < ROWS && nc >= 0 && nc < COLS && grid[nr][nc].mine) count++;
          }
        }
        grid[r][c].count = count;
      }
    }
    render();
  }

  function reveal(r, c) {
    if (r < 0 || r >= ROWS || c < 0 || c >= COLS) return;
    const cell = grid[r][c];
    if (cell.revealed || cell.flagged) return;
    cell.revealed = true;
    revealedCount++;
    if (cell.count === 0 && !cell.mine) {
      for (let dr = -1; dr <= 1; dr++) {
        for (let dc = -1; dc <= 1; dc++) {
          if (dr || dc) reveal(r + dr, c + dc);
        }
      }
    }
  }

  function render() {
    boardEl.innerHTML = '';
    for (let r = 0; r < ROWS; r++) {
      for (let c = 0; c < COLS; c++) {
        const cell = grid[r][c];
        const div = document.createElement('div');
        div.className = 'cell' + (cell.revealed ? ' revealed' : '') + (cell.revealed && cell.mine ? ' mine' : '') + (cell.flagged ? ' flag' : '');
        if (cell.revealed && cell.mine) div.textContent = '💣';
        else if (cell.revealed && cell.count > 0) div.textContent = cell.count;
        else if (cell.flagged) div.textContent = '🚩';

        div.onclick = () => {
          if (gameOver || cell.flagged) return;
          if (cell.mine) {
            cell.revealed = true;
            revealAllMines();
            gameOver = true;
            statusEl.textContent = 'Boom! Verloren.';
            render();
            return;
          }
          reveal(r, c);
          render();
          checkWin();
        };
        div.oncontextmenu = (e) => {
          e.preventDefault();
          if (gameOver || cell.revealed) return;
          cell.flagged = !cell.flagged;
          render();
        };
        boardEl.appendChild(div);
      }
    }
  }

  function revealAllMines() {
    for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) if (grid[r][c].mine) grid[r][c].revealed = true;
  }

  function checkWin() {
    if (revealedCount === ROWS * COLS - MINES) {
      gameOver = true;
      statusEl.textContent = 'Gewonnen! 🎉';
    }
  }

  resetGame();
</script>

</body>
</html>
