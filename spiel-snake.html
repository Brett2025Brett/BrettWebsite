<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Snake — BRETT Game PRO Session</title>
<link rel="stylesheet" href="style3.css">
<style>
  .game-wrap{ margin-top:26px; text-align:center; }
  canvas{
    background:var(--void); border:1px solid var(--line); border-radius:10px;
    box-shadow:0 20px 50px -20px rgba(255,90,31,0.3);
    max-width:100%;
  }
  .hud{
    display:flex; justify-content:center; gap:30px; margin-bottom:16px;
    font-family:'Rajdhani',sans-serif; font-weight:700; font-size:1.1rem; color:var(--glow);
  }
  .tool-btn{
    font-family:'Rajdhani',sans-serif; font-weight:700; font-size:0.95rem;
    padding:12px 26px; border-radius:8px; border:none; cursor:pointer;
    color:var(--void); background:linear-gradient(135deg, var(--glow), var(--ember));
    box-shadow:0 10px 24px -10px rgba(255,90,31,0.55); margin-top:20px;
    transition:transform .2s ease;
  }
  .tool-btn:hover{ transform:translateY(-2px); }
  .hint{ margin-top:14px; font-size:0.82rem; color:var(--ash-dim); }
</style>
</head>
<body>

<header class="top">
  <div class="nav-wrap">
    <div class="brand"><span class="mark">BRETT</span><span class="tag">We know</span></div>
    <nav class="links">
      <a href="mainpage.html">Willkommen</a>
      <a href="downloadcenter_new.html">Downloads</a>
      <a href="Online-tools.html">Onlinetools</a>
      <a href="Lizenz.html">Lizenz</a>
      <a href="brett-spiele.html" class="active">Spiele</a>
    </nav>
  </div>
</header>

<main>
  <a class="back-link" href="brett-game-pro-session.html">Zurück zur PRO Session</a>
  <span class="eyebrow">Brett Game PRO Session</span>
  <h1 class="page-title">Snake</h1>
  <p class="lede">Steuerung: Pfeiltasten oder WASD.</p>

  <div class="game-wrap">
    <div class="hud">
      <div>Punkte: <span id="score">0</span></div>
      <div>Highscore: <span id="highscore">0</span></div>
    </div>
    <canvas id="game" width="400" height="400"></canvas>
    <br>
    <button class="tool-btn" onclick="resetGame()">Neustart</button>
    <p class="hint">Tipp: Nicht in dich selbst oder die Wand fahren.</p>
  </div>
</main>

<script>
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const grid = 20;
  const cells = canvas.width / grid;
  let snake, dir, food, score, gameOver, loop;
  let highscore = parseInt(localStorage.getItem('brett_snake_hs') || '0');
  document.getElementById('highscore').textContent = highscore;

  function randFood() {
    return {
      x: Math.floor(Math.random() * cells),
      y: Math.floor(Math.random() * cells)
    };
  }

  function resetGame() {
    snake = [{x:10, y:10}];
    dir = {x:1, y:0};
    food = randFood();
    score = 0;
    gameOver = false;
    document.getElementById('score').textContent = score;
    if (loop) clearInterval(loop);
    loop = setInterval(tick, 110);
  }

  function tick() {
    if (gameOver) return;
    const head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };

    if (head.x < 0 || head.y < 0 || head.x >= cells || head.y >= cells ||
        snake.some(s => s.x === head.x && s.y === head.y)) {
      gameOver = true;
      clearInterval(loop);
      if (score > highscore) {
        highscore = score;
        localStorage.setItem('brett_snake_hs', highscore);
        document.getElementById('highscore').textContent = highscore;
      }
      draw();
      ctx.fillStyle = 'rgba(12,9,6,0.75)';
      ctx.fillRect(0,0,canvas.width,canvas.height);
      ctx.fillStyle = '#ffb44d';
      ctx.font = 'bold 28px Rajdhani, sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText('Game Over', canvas.width/2, canvas.height/2);
      return;
    }

    snake.unshift(head);
    if (head.x === food.x && head.y === food.y) {
      score += 10;
      document.getElementById('score').textContent = score;
      food = randFood();
    } else {
      snake.pop();
    }
    draw();
  }

  function draw() {
    ctx.fillStyle = '#0c0906';
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    ctx.fillStyle = '#ff5a1f';
    ctx.fillRect(food.x * grid, food.y * grid, grid - 2, grid - 2);

    snake.forEach((s, i) => {
      ctx.fillStyle = i === 0 ? '#ffb44d' : '#ff7a3d';
      ctx.fillRect(s.x * grid, s.y * grid, grid - 2, grid - 2);
    });
  }

  document.addEventListener('keydown', (e) => {
    const key = e.key.toLowerCase();
    if ((key === 'arrowup' || key === 'w') && dir.y === 0) dir = {x:0, y:-1};
    else if ((key === 'arrowdown' || key === 's') && dir.y === 0) dir = {x:0, y:1};
    else if ((key === 'arrowleft' || key === 'a') && dir.x === 0) dir = {x:-1, y:0};
    else if ((key === 'arrowright' || key === 'd') && dir.x === 0) dir = {x:1, y:0};
  });

  resetGame();
</script>

</body>
</html>
