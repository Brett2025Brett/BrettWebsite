<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BrettHTMLeditor Pro — BRETT</title>

  <link rel="stylesheet" href="style.css">
  <style>
    :root {
      --editor-bg: #0c0906;
      --editor-panel: #17100b;
      --editor-text: #f2e6d8;
      --editor-accent: #ff7a3d;
      --border-radius: 8px;
    }

    html, body{ height:auto; }

    .editor-shell {
      display: flex;
      flex-direction: column;
      min-height: 72vh;
      margin-top: 26px;
      border:1px solid var(--line);
      border-radius: var(--radius);
      overflow: hidden;
    }

    .editor-header {
      background-color: var(--editor-panel);
      padding: 16px 20px;
      border-bottom: 1px solid var(--line);
      display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:10px;
    }
    .editor-header p{ margin:0; font-size:13px; color:var(--ash); }

    .editor-main {
      display: flex;
      flex: 1;
      min-height: 420px;
    }

    textarea#htmlInput {
      width: 50%;
      background-color: var(--editor-panel);
      color: var(--editor-text);
      border: none;
      padding: 20px;
      font-size: 15px;
      font-family: 'Courier New', monospace;
      resize: none;
      outline: none;
      border-right: 1px solid var(--line);
    }

    iframe#preview {
      width: 50%;
      border: none;
      background-color: #fff;
    }

    .editor-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 20px;
      font-size: 12px;
      background-color: var(--editor-panel);
      border-top: 1px solid var(--line);
      color: var(--ash-dim);
    }

    .buttons {
      display: flex;
      gap: 10px;
    }

    .buttons button {
      background: linear-gradient(135deg, var(--glow), var(--ember));
      color: var(--void);
      border: none;
      padding: 9px 18px;
      border-radius: var(--border-radius);
      cursor: pointer;
      font-size: 13px;
      font-weight:600;
      font-family:'Rajdhani', sans-serif;
      letter-spacing:0.02em;
      transition: transform 0.2s ease;
    }
    .buttons button:hover{ transform:translateY(-2px); }
  </style>
</head>

<body>

<header class="top">
  <div class="nav-wrap">
    <div class="brand"><span class="mark">BRETT</span><span class="tag">We know</span></div>
    <nav class="links">
      <a href="mainpage.html">Willkommen</a>
      <a href="downloadcenter_new.html">Downloads</a>
      <a href="https://brett2025brett.github.io/BrettWebsite/Online-tools.html" class="active">Onlinetools</a>
      <a href="Lizenz.html">Lizenz</a>
      <a href="brett-spiele.html">Spiele</a>
    </nav>
  </div>
</header>

<main>
  <a class="back-link" href="https://brett2025brett.github.io/BrettWebsite/Online-tools.html">Zurück zu Onlinetools</a>
  <span class="eyebrow">Onlinetool</span>
  <h1 class="page-title">BrettHTMLeditor Pro</h1>
  <p class="lede">Live-Vorschau, Datei speichern & URL kopieren.</p>

  <div class="editor-shell">
    <div class="editor-header">
      <p>Bearbeite den Code links, sieh die Vorschau rechts.</p>
    </div>

    <div class="editor-main">
      <textarea id="htmlInput" placeholder="Gib hier deinen HTML-Code ein..."></textarea>
      <iframe id="preview"></iframe>
    </div>

    <div class="editor-footer">
      <span></span>
      <div class="buttons">
        <button id="saveBtn">💾 Speichern</button>
        <button id="copyUrlBtn">🔗 URL kopieren</button>
      </div>
    </div>
  </div>
</main>


<script>
    const input = document.getElementById('htmlInput');
    const preview = document.getElementById('preview');
    const saveBtn = document.getElementById('saveBtn');
    const copyUrlBtn = document.getElementById('copyUrlBtn');

    // Vorschau aktualisieren
    input.addEventListener('input', () => {
      preview.srcdoc = input.value;
    });

    // Speichern als Datei
    saveBtn.addEventListener('click', () => {
      const htmlContent = input.value;
      const blob = new Blob([htmlContent], { type: 'text/html' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'brettHTMLeditor.html';
      a.click();
      URL.revokeObjectURL(url);
    });

    // URL kopieren
    copyUrlBtn.addEventListener('click', () => {
      const encoded = encodeURIComponent(input.value);
      const dataUrl = `data:text/html;charset=utf-8,${encoded}`;
      navigator.clipboard.writeText(dataUrl)
        .then(() => alert('Data-URL wurde kopiert!'))
        .catch(() => alert('Fehler beim Kopieren der URL.'));
    });

    // Beispielinhalt beim Start
    input.value = `
<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title>Beispielseite</title>
  <style>
    body { font-family: sans-serif; padding: 20px; background-color: #f9f9f9; }
    h1 { color: #00bcd4; }
  </style>
</head>
<body>
  <h1>Willkommen bei BrettHTMLeditor Pro!</h1>
  <p>Bearbeite den HTML-Code links und sieh die Vorschau rechts.</p>
</body>
</html>
    `;
    preview.srcdoc = input.value;
</script>
</body>
</html>
