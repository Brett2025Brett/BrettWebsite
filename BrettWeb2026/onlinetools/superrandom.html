


<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BRETT 2026 Design Preview</title>

<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<link rel="stylesheet" href="style.css">

</head>

<body>
<canvas id="particles"></canvas>





<div class="main">

<h1 style="margin-bottom:30px;">SuperRandom</h1>

<div class="grid" id="grid">

<div class="card" draggable="true" data-id="1">
<p>Die neue Version von SuperRandom
besitzt ein neues Design und bleibt auch bei größeren Mengen an zu
Generierenden Zeichen stabil (benötigt schnellen Rechner!)</p>
</div>


<div class="card" draggable="true" data-id="2">
 <h1>SuperRandom</h1>
    <p>Mit diesem Tool können Sie ganz einfach eine komplett zufällige Kombination aus Zeichen erstellen!</p>
    <label for="anzahlderzeichen">Anzahl der Zeichen:</label>
    <input type="number" id="anzahlderzeichen">
    <button type="button" onclick="generate();">Generieren</button>
    <br>
<textarea rows="5"cols="40"id="Zeichen">ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789</textarea>
<br>
    <textarea id="ergebnistext" rows="20" cols="70" style="resize: none;">Hier erscheint das Ergebnis!</textarea>
    <script>
        function generate() {
                        let result = '';
            const characters = Zeichen.value;
            const charactersLength = characters.length;
            const anzahlderzeichen = document.getElementById('anzahlderzeichen').value;
            let counter = 0;
            while (counter < anzahlderzeichen) {
                result += characters.charAt(Math.floor(Math.random() * charactersLength));
                counter += 1;
            }
            document.getElementById('ergebnistext').value = result;

        }
    </script>

</div>








</div>
</div>
