<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PasswortRandom — BRETT</title>
<link rel="stylesheet" href="../style.css">
<style>
  .tool-panel{
    background:linear-gradient(180deg, var(--char-2), var(--char));
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:32px;
    margin-top:30px;
    max-width:640px;
  }
  .field{ margin-bottom:20px; }
  .field label{
    display:block; font-size:0.82rem; font-weight:600;
    color:var(--ash); margin-bottom:8px; letter-spacing:0.02em;
  }
  select, textarea, input[type="number"], input[type="text"]{
    width:100%;
    background:var(--void);
    border:1px solid var(--line);
    color:var(--paper);
    font-family:'Inter', sans-serif;
    font-size:0.92rem;
    padding:11px 14px;
    border-radius:8px;
    outline:none;
    transition:border-color .2s ease;
  }
  select:focus, textarea:focus, input:focus{ border-color:var(--ember); }
  textarea{ font-family:'Courier New', monospace; resize:vertical; line-height:1.5; }
  .tool-btn{
    font-family:'Rajdhani',sans-serif; font-weight:700; font-size:0.95rem;
    letter-spacing:0.02em;
    padding:12px 26px; border-radius:8px; border:none; cursor:pointer;
    color:var(--void);
    background:linear-gradient(135deg, var(--glow), var(--ember));
    box-shadow:0 10px 24px -10px rgba(255,90,31,0.55);
    transition:transform .2s ease;
  }
  .tool-btn:hover{ transform:translateY(-2px); }
</style>
</head>
<body>

<header class="top">
  <div class="nav-wrap">
    <div class="brand"><span class="mark">BRETT</span><span class="tag">We know</span></div>
    <nav class="links">
      <a href="../mainpage.html">Willkommen</a>
      <a href="../downloadcenter_new.html">Downloads</a>
      <a href="https://brett2025brett.github.io/BrettWebsite/Online-tools.html" class="active">Onlinetools</a>
      <a href="../Lizenz.html">Lizenz</a>
      <a href="../brett-spiele.html">Spiele</a>
    </nav>
  </div>
</header>

<main>
  <a class="back-link" href="https://brett2025brett.github.io/BrettWebsite/Online-tools.html">Zurück zu Onlinetools</a>
  <span class="eyebrow">Onlinetool</span>
  <h1 class="page-title">PasswortRandom</h1>
  <p class="lede">Der sicherste Passwortgenerator der Welt.</p>

  <div class="tool-panel">
    <div class="field">
      <label for="anzahlderzeichen">Anzahl der Zeichen — wähle eine Option:</label>
      <select id="anzahlderzeichen" name="anzahlderzeichen">
        <option value="1">Ein-Zeichen-Passwort (nicht empfohlen)</option>
        <option value="4">Schülerpasswort</option>
        <option value="8">Genügende Sicherheit</option>
        <option value="12">Mittelmäßige Sicherheit</option>
        <option value="18">Gute Sicherheit</option>
        <option value="22">Sehr Gute Sicherheit</option>
        <option value="30">Extrem Gute Sicherheit</option>
        <option value="35">Übermäßig Gute Sicherheit</option>
        <option value="40">Buisness-Server Sicherheit</option>
        <option value="50">Buisness-Cloud Sicherheit</option>
        <option value="50">Laufwerksverschlüsselungskey</option>
        <option value="80">BitLockser-Laufwerkswiederherstellungsschlüssel</option>
        <option value="100">Anti-Hack-Passwort</option>
        <option value="1000">Sehr starker Verschlüsselungskey</option>
      </select>
    </div>

    <button type="button" class="tool-btn" onclick="generate();">Generieren</button>

    <div class="field" style="margin-top:22px;">
      <label for="ergebnistext">Ergebnis</label>
      <textarea id="ergebnistext" rows="6" style="resize:none;">Hier erscheint das Ergebnis!</textarea>
    </div>
  </div>
</main>


<script>
    function generate() {
                    let result = '';
        const characters = "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789!?_+#";
        const charactersLength = characters.length;
        const anzahlderzeichen = document.getElementById('anzahlderzeichen').value;
        let counter = 0;
        while (counter < anzahlderzeichen) {
            result += characters.charAt(Math.floor(Math.random() * charactersLength));
            counter += 1;
        }
        document.getElementById('ergebnistext').value = result;

    }
</script>

</body>
</html>
