<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BRETT | Registrierung Erfolgreich</title>

<style>
body {
  margin: 0;
  font-family: 'Segoe UI', sans-serif;
  background: linear-gradient(135deg,#ff7043,#e64a19);
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
}

.card {
  background: rgba(255,255,255,0.15);
  backdrop-filter: blur(25px);
  padding: 60px 40px;
  border-radius: 25px;
  box-shadow: 0 25px 50px rgba(0,0,0,0.35);
  text-align: center;
  color: white;
  width: 400px;
  animation: fadeIn 0.8s ease;
}

.card h1 {
  font-size: 24px;
  margin-bottom: 20px;
}

.card p {
  margin-bottom: 30px;
  font-size: 15px;
}

button {
  padding: 14px 30px;
  border-radius: 50px;
  border: none;
  background: white;
  color: #e64a19;
  font-weight: bold;
  cursor: pointer;
  transition: 0.3s;
}

button:hover {
  transform: scale(1.05);
}

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(20px); }
  to { opacity: 1; transform: translateY(0); }
}
</style>
</head>

<body>

<div class="card">
  <h1>🎉 Registrierung erfolgreich!</h1>
  <p>Dein Konto wurde erfolgreich erstellt.</p>

  <button onclick="window.location.href='logonUI.html'">
    Jetzt anmelden
  </button>
</div>

</body>
</html>
