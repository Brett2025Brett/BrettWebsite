<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BRETT | Registrieren</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  font-family: 'Segoe UI', sans-serif;
}

body {
  background: linear-gradient(135deg, #ff7043, #e64a19);
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
}

/* BOX */
.box {
  background: rgba(255,255,255,0.15);
  backdrop-filter: blur(15px);
  padding: 40px;
  width: 360px;
  border-radius: 20px;
  box-shadow: 0 20px 40px rgba(0,0,0,0.3);
  text-align: center;
  color: white;
  animation: fadeIn 0.6s ease;
}

@keyframes fadeIn {
  from { opacity:0; transform: translateY(20px); }
  to { opacity:1; transform: translateY(0); }
}

.box h1 {
  margin-bottom: 15px;
}

.box p {
  font-size: 14px;
  margin-bottom: 15px;
}

.input-group {
  position: relative;
  margin-bottom: 15px;
}

.input-group i {
  position: absolute;
  left: 12px;
  top: 50%;
  transform: translateY(-50%);
  opacity: 0.8;
}

.input-group input {
  width: 100%;
  padding: 12px 12px 12px 38px;
  border: none;
  border-radius: 30px;
  outline: none;
}

.btn {
  width: 100%;
  padding: 12px;
  margin-top: 15px;
  border: none;
  border-radius: 30px;
  background: white;
  color: #e64a19;
  font-weight: bold;
  cursor: pointer;
  transition: 0.3s;
}

.btn:hover {
  transform: scale(1.05);
}

.loader {
  border: 4px solid rgba(255,255,255,0.3);
  border-top: 4px solid white;
  border-radius: 50%;
  width: 30px;
  height: 30px;
  margin: 15px auto;
  animation: spin 1s linear infinite;
  display: none;
}

@keyframes spin {
  100% { transform: rotate(360deg); }
}

#msg {
  margin-top: 10px;
  font-size: 14px;
  color: #ffdddd;
}

.link {
  display: block;
  margin-top: 15px;
  font-size: 13px;
  color: white;
  text-decoration: none;
}

.link:hover {
  text-decoration: underline;
}
</style>
</head>

<body>

<div class="box">
  <h1>BRETT Registrierung</h1>
  <p>Wir freuen uns sehr, dass Sie ein neues Konto erstellen wollen!</p>

  <div class="input-group">
    <i class="fa-solid fa-envelope"></i>
    <input id="email" type="email" placeholder="E-Mail">
  </div>

  <div class="input-group">
    <i class="fa-solid fa-lock"></i>
    <input id="password" type="password" placeholder="Passwort">
  </div>

  <p id="msg"></p>

  <button id="signupBtnEINS" class="btn">Registrieren</button>
  <div id="spinner" class="loader"></div>

  <a href="logonUI.html" class="link">
    Haben Sie bereits ein Konto? Anmelden!
  </a>
</div>

<script type="module">
import { signUp, getSession } from "./auth.js";

const email = document.getElementById("email");
const password = document.getElementById("password");
const msg = document.getElementById("msg");
const spinner = document.getElementById("spinner");
const signupBtn = document.getElementById("signupBtnEINS");

signupBtn.addEventListener("click", async () => {
  msg.textContent = "";
  spinner.style.display = "block";
  signupBtn.style.display = "none";

  try {
    await signUp(email.value, password.value);
    window.location.href = "signupsucess.html";
  } catch (err) {
    msg.textContent = err.message;
    spinner.style.display = "none";
    signupBtn.style.display = "block";
  }
});

// Falls bereits eingeloggt → Dashboard
(async () => {
  const session = await getSession();
  if (session) window.location.href = "dashboard.html";
})();
</script>

</body>
</html>
