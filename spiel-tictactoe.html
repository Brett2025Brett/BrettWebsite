<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tic-Tac-Toe — BRETT Game PRO Session</title>
<link rel="stylesheet" href="style3.css">
<style>
  .game-wrap{ margin-top:26px; text-align:center; }
  .board{
    display:grid; grid-template-columns:repeat(3, 100px); grid-template-rows:repeat(3, 100px);
    gap:8px; margin:0 auto; width:fit-content;
  }
  .cell{
    background:var(--char-2); border:1px solid var(--line); border-radius:8px;
    display:flex; align-items:center; justify-content:center;
    font-family:'Rajdhani',sans-serif; font-weight:700; font-size:2.6rem;
    cursor:pointer; transition:background .2s ease;
  }
  .cell:hover{ background:rgba(255,138,61,0.1); }
  .cell.x{ color:#ffb44d; }
  .cell.o{ color:#7de0ff; }
  #status{ margin-top:20px; font-family:'Rajdhani',sans-serif; font-weight:700; font-size:1.2rem; color:var(--glow); }
  .tool-btn{
    font-family:'Rajdhani',sans-serif; font-weight:700; font-size:0.95rem;
    padding:12px 26px; border-radius:8px; border:none; cursor:pointer;
    color:var(--void); background:linear-gradient(135deg, var(--glow), var(--ember));
    box-shadow:0 10px 24px -10px rgba(255,90,31,0.55); margin-top:20px;
    transition:transform .2s ease;
  }
  .tool-btn:hover{ transform:translateY(-2px); }
</style>
</head>
<body>

<header class="top">
  <div class="nav-wrap">
    <div class="brand"><span class="mark">BRETT</span><span class="tag">We know</span></div>
    <nav class="links">
      <a href="mainpage.html">Willkommen</a>
      <a href="downloadcenter_new.html">Downloads</a>
      <a href="Online-tools.html">Onlinetools</a>
      <a href="Lizenz.html">Lizenz</a>
      <a href="brett-spiele.html" class="active">Spiele</a>
    </nav>
  </div>
</header>

<main>
  <a class="back-link" href="brett-game-pro-session.html">Zurück zur PRO Session</a>
  <span class="eyebrow">Brett Game PRO Session</span>
  <h1 class="page-title">Tic-Tac-Toe</h1>
  <p class="lede">Du bist X, die KI ist O — die KI spielt perfekt (Minimax), also bestenfalls Unentschieden!</p>

  <div class="game-wrap">
    <div class="board" id="board"></div>
    <p id="status">Du bist dran</p>
    <button class="tool-btn" onclick="resetGame()">Neustart</button>
  </div>
</main>

<script>
  let board, gameOver;
  const boardEl = document.getElementById('board');
  const statusEl = document.getElementById('status');
  const wins = [[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];

  function resetGame() {
    board = Array(9).fill(null);
    gameOver = false;
    statusEl.textContent = 'Du bist dran';
    render();
  }

  function render() {
    boardEl.innerHTML = '';
    board.forEach((v, i) => {
      const cell = document.createElement('div');
      cell.className = 'cell' + (v === 'X' ? ' x' : v === 'O' ? ' o' : '');
      cell.textContent = v || '';
      cell.onclick = () => playerMove(i);
      boardEl.appendChild(cell);
    });
  }

  function checkWinner(b) {
    for (const [a, c, d] of wins) {
      if (b[a] && b[a] === b[c] && b[a] === b[d]) return b[a];
    }
    if (b.every(x => x)) return 'draw';
    return null;
  }

  function playerMove(i) {
    if (gameOver || board[i]) return;
    board[i] = 'X';
    render();
    const result = checkWinner(board);
    if (result) return endGame(result);
    statusEl.textContent = 'KI denkt...';
    setTimeout(aiMove, 300);
  }

  function aiMove() {
    const best = minimax(board, 'O').index;
    board[best] = 'O';
    render();
    const result = checkWinner(board);
    if (result) return endGame(result);
    statusEl.textContent = 'Du bist dran';
  }

  function endGame(result) {
    gameOver = true;
    if (result === 'draw') statusEl.textContent = 'Unentschieden!';
    else if (result === 'X') statusEl.textContent = 'Du hast gewonnen!';
    else statusEl.textContent = 'Die KI hat gewonnen.';
  }

  function minimax(b, player) {
    const winner = checkWinner(b);
    if (winner === 'X') return { score: -10 };
    if (winner === 'O') return { score: 10 };
    if (winner === 'draw') return { score: 0 };

    const moves = [];
    for (let i = 0; i < 9; i++) {
      if (!b[i]) {
        const newB = b.slice();
        newB[i] = player;
        const result = minimax(newB, player === 'O' ? 'X' : 'O');
        moves.push({ index: i, score: result.score });
      }
    }

    if (player === 'O') {
      return moves.reduce((best, m) => m.score > best.score ? m : best);
    } else {
      return moves.reduce((best, m) => m.score < best.score ? m : best);
    }
  }

  resetGame();
</script>

</body>
</html>
