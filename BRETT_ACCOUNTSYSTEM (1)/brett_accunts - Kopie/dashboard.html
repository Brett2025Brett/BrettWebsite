<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BRETT Enterprise Dashboard</title>

<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif;}

body{
  height:100vh;
  display:flex;
  background:#0b1120;
  color:white;
  overflow:hidden;
}

/* PARTICLE BACKGROUND */
#particles{
  position:fixed;
  width:100%;
  height:100%;
  background:radial-gradient(circle at 20% 20%,#00f2ff22,transparent 40%),
             radial-gradient(circle at 80% 70%,#0077ff22,transparent 40%);
  z-index:0;
}

/* SIDEBAR */
.sidebar{
  width:260px;
  background:rgba(20,30,60,0.6);
  backdrop-filter:blur(20px);
  padding:25px;
  display:flex;
  flex-direction:column;
  justify-content:space-between;
  z-index:2;
}

.logo{
  font-size:22px;
  font-weight:bold;
  color:#00f2ff;
  margin-bottom:30px;
  text-shadow:0 0 15px #00f2ff;
}

.nav a{
  display:flex;
  align-items:center;
  gap:12px;
  padding:12px;
  margin-bottom:10px;
  border-radius:10px;
  text-decoration:none;
  color:#ccc;
  transition:.3s;
}

.nav a:hover{
  background:#00f2ff;
  color:black;
  box-shadow:0 0 20px #00f2ff;
}

.logout button{
  width:100%;
  padding:10px;
  border:none;
  border-radius:8px;
  background:#ff3b3b;
  color:white;
  cursor:pointer;
}

.main{
  flex:1;
  padding:40px;
  overflow-y:auto;
  position:relative;
  z-index:1;
}

.cards{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
  gap:20px;
  margin-bottom:30px;
}

.card{
  background:rgba(255,255,255,0.05);
  backdrop-filter:blur(20px);
  padding:20px;
  border-radius:15px;
  transition:.3s;
}

.card:hover{
  transform:translateY(-6px);
  box-shadow:0 0 30px #00f2ff55;
}

.stat{font-size:28px;font-weight:bold;}

/* XP BAR */
.xp-bar{
  width:100%;
  height:12px;
  background:#1e293b;
  border-radius:10px;
  overflow:hidden;
  margin-top:10px;
}

.xp-fill{
  height:100%;
  width:65%;
  background:linear-gradient(90deg,#00f2ff,#0077ff);
}

/* BADGES */
.badges span{
  display:inline-block;
  background:#00f2ff22;
  padding:6px 10px;
  border-radius:20px;
  margin:5px;
  font-size:12px;
}

/* MOBILE */
@media(max-width:768px){
  .sidebar{display:none;}
}
</style>
</head>

<body>

<div id="particles"></div>

<div class="sidebar">
  <div>
    <div class="logo">BRETT</div>
    <div class="nav">
      <a href="#"><i class="fas fa-home"></i> Home</a>
      <a href="https://brett2025brett.github.io/BrettWebsite/downloadcenter.html">
        <i class="fas fa-download"></i> Downloads
      </a>
      <a href="https://brett2025brett.github.io/BrettWebsite/projekte.html">
        <i class="fas fa-folder"></i> Projekte
      </a>
      <a href="https://brett2025brett.github.io/BrettWebsite/account.html">
        <i class="fas fa-user"></i> Account
      </a>
    </div>
  </div>
  <div class="logout">
    <button id="logoutBtn">Logout</button>
  </div>
</div>

<div class="main">

<h1 style="margin-bottom:30px;">Enterprise Control Panel</h1>

<div class="cards">
  <div class="card">
    <h3>Level 5 Account</h3>
    <div class="xp-bar"><div class="xp-fill"></div></div>
  </div>

  <div class="card">
    <h3>Badges</h3>
    <div class="badges">
      <span>🚀 Early User</span>
      <span>💎 Premium</span>
      <span>🔥 Active</span>
    </div>
  </div>
</div>

<div class="card">
  <h3>Analytics</h3>
  <canvas id="chart"></canvas>
</div>

<div class="card">
  <h3>User</h3>
  <p id="user"></p>
</div>

</div>

<script type="module">
import { getSession, logout } from "./auth.js";

const userEl=document.getElementById("user");

(async()=>{
  const session=await getSession();
  if(!session){
    window.location.href="loginUI.html";
    return;
  }
  userEl.textContent="Eingeloggt als: "+session.user.email;
})();

document.getElementById("logoutBtn").onclick=async()=>{
  await logout();
  window.location.href="loginUI.html";
};

/* Chart */
new Chart(document.getElementById("chart"),{
  type:"line",
  data:{
    labels:["Mo","Di","Mi","Do","Fr","Sa","So"],
    datasets:[{
      label:"Downloads",
      data:[12,19,7,15,22,18,30],
      borderColor:"#00f2ff",
      backgroundColor:"rgba(0,242,255,0.2)",
      tension:0.4,
      fill:true
    }]
  },
  options:{
    plugins:{legend:{labels:{color:"white"}}},
    scales:{
      x:{ticks:{color:"white"}},
      y:{ticks:{color:"white"}}
    }
  }
});
</script>

</body>
</html>
