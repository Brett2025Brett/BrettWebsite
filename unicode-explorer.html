  <style>
    .tool-panel{
      background:linear-gradient(180deg, var(--char-2), var(--char));
      border:1px solid var(--line);
      border-radius:var(--radius);
      padding:28px 30px;
      margin-top:30px;
    }
    .controls{ display:flex; flex-wrap:wrap; gap:12px; align-items:center; margin-bottom:6px; }
    .controls label{ font-size:0.85rem; color:var(--ash); }
    select, input[type="text"]{
      background:var(--void);
      border:1px solid var(--line);
      color:var(--paper);
      font-family:'Inter', sans-serif;
      font-size:0.88rem;
      padding:10px 12px;
      border-radius:8px;
      outline:none;
      transition:border-color .2s ease;
    }
    select{ min-width:280px; }
    select:focus, input:focus{ border-color:var(--ember); }
    .tool-btn{
      font-family:'Rajdhani',sans-serif; font-weight:700; font-size:0.9rem;
      letter-spacing:0.02em;
      padding:10px 22px; border-radius:8px; border:none; cursor:pointer;
      color:var(--void);
      background:linear-gradient(135deg, var(--glow), var(--ember));
      box-shadow:0 10px 24px -10px rgba(255,90,31,0.55);
      transition:transform .2s ease;
    }
    .tool-btn:hover{ transform:translateY(-2px); }
    #grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(58px, 1fr));
      gap: 10px;
      margin-top: 26px;
    }
    .charBox {
      background: var(--void);
      border:1px solid var(--line);
      padding: 10px 6px;
      border-radius: 8px;
      text-align: center;
      font-size: 1.4rem;
      color: var(--paper);
      cursor: pointer;
      transition: transform .15s ease, border-color .15s ease, background .15s ease;
    }
    .charBox:hover {
      background: rgba(255,138,61,0.1);
      border-color: var(--ember);
      transform: scale(1.08);
    }
    .info {
      font-size: 0.62rem;
      color: var(--ash);
      margin-top:4px;
    }
  </style>

  <h1 class="page-title">BRETT Unicode Explorer</h1>
  <p class="lede">Unicode-Blöcke durchsuchen oder gezielt nach einem Codepoint suchen.</p>

  <div class="tool-panel">
    <div class="controls">
      <label>Unicode-Block auswählen:</label>
      <select id="blockSelect"></select>
      <button class="tool-btn" onclick="loadBlock()">Laden</button>
    </div>

    <hr class="ember" style="margin:22px 0;">

    <div class="controls">
      <label>Manuelle Unicode-Eingabe (Hex):</label>
      <input type="text" id="manualInput" placeholder="z. B. 1F984 für 🦄" />
      <button class="tool-btn" onclick="searchChar()">Zeichen anzeigen</button>
    </div>

    <div id="grid"></div>
  </div>
</main>


<script>
  function copyChar(char) {
    navigator.clipboard.writeText(char).then(() => {
      alert("Kopiert: " + char);
    });
  }

  function loadBlock() {
    const grid = document.getElementById("grid");
    grid.innerHTML = "";
    const range = document.getElementById("blockSelect").value.split("-");
    let start = parseInt(range[0], 16);
    let end = parseInt(range[1], 16);

    while (start <= end) {
      try {
        const char = String.fromCodePoint(start);
        const box = document.createElement("div");
        box.className = "charBox";
        box.innerHTML = char + "<div class='info'>U+" + start.toString(16).toUpperCase().padStart(4, '0') + "</div>";
        box.onclick = () => copyChar(char);
        grid.appendChild(box);
      } catch (e) {}
      start++;
    }
  }

  function searchChar() {
    const grid = document.getElementById("grid");
    grid.innerHTML = "";
    const hex = document.getElementById("manualInput").value.trim();
    if (!hex) return;
    const code = parseInt(hex, 16);
    try {
      const char = String.fromCodePoint(code);
      const box = document.createElement("div");
      box.className = "charBox";
      box.innerHTML = char + "<div class='info'>U+" + hex.toUpperCase() + "</div>";
      box.onclick = () => copyChar(char);
      grid.appendChild(box);
    } catch (e) {
      alert("Ungültiger Codepoint.");
    }
  }
