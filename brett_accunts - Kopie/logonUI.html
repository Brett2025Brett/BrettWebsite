<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>BRETT Login</title>
<style>
body {
  font-family: Arial;
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
  background: #f5f5f5;
}
.box {
  width: 350px;
  padding: 30px;
  background: white;
  border-radius: 10px;
  box-shadow: 0 5px 15px rgba(0,0,0,0.2);
}
input {
  width: 100%;
  padding: 10px;
  margin-bottom: 15px;
}
button {
  width: 100%;
  padding: 10px;
  background: #ff7043;
  border: none;
  color: white;
  cursor: pointer;
}
a {
  display: block;
  text-align: center;
  margin-top: 15px;
}
</style>
</head>
<body>

<div class="box">
<h2>Login</h2>

<input type="email" placeholder="E-Mail">
<input type="password" placeholder="Passwort">

<button onclick="login()">Anmelden</button>

<a href="/BrettWebsite/register.html">Noch kein Konto? Registrieren</a>
</div>

<script>
function login() {
  // Hier später echte Auth
  window.location.href = "/BrettWebsite/dashboard.html";
}
</script>

</body>
</html>
