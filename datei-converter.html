<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Datei-Converter — BRETT</title>
<link rel="stylesheet" href="style3.css">
<style>
  .tabs{ display:flex; gap:10px; margin:26px 0 0; flex-wrap:wrap; }
  .tab{
    padding:9px 20px; border-radius:20px; font-size:0.85rem; cursor:pointer;
    border:1px solid var(--line); color:var(--ash);
    transition:all .2s ease;
  }
  .tab.active{ background:linear-gradient(135deg, var(--glow), var(--ember)); color:var(--void); border-color:transparent; font-weight:600; }
  .tool-panel{
    background:linear-gradient(180deg, var(--char-2), var(--char));
    border:1px solid var(--line); border-radius:var(--radius);
    padding:32px; margin-top:16px; max-width:640px;
  }
  .panel-section{ display:none; }
  .panel-section.active{ display:block; }
  .drop{
    border:1.5px dashed var(--line); border-radius:10px;
    padding:34px 20px; text-align:center;
    transition:border-color .2s ease, background .2s ease;
  }
  .drop:hover{ border-color:var(--ember); background:rgba(255,138,61,0.05); }
  input[type="file"]{ color:var(--ash); font-size:0.88rem; }
  .field{ margin:20px 0; }
  .field label{ display:block; font-size:0.82rem; font-weight:600; color:var(--ash); margin-bottom:8px; }
  select, textarea{
    width:100%; background:var(--void); border:1px solid var(--line); color:var(--paper);
    font-family:'Inter', sans-serif; font-size:0.92rem; padding:11px 14px; border-radius:8px; outline:none;
  }
  textarea{ font-family:'Courier New', monospace; font-size:0.86rem; resize:vertical; }
  .tool-btn{
    font-family:'Rajdhani',sans-serif; font-weight:700; font-size:0.95rem;
    padding:12px 26px; border-radius:8px; border:none; cursor:pointer;
    color:var(--void); background:linear-gradient(135deg, var(--glow), var(--ember));
    box-shadow:0 10px 24px -10px rgba(255,90,31,0.55);
    transition:transform .2s ease;
  }
  .tool-btn:hover{ transform:translateY(-2px); }
  .tool-btn:disabled{ opacity:0.5; cursor:default; transform:none; }
  #imgPreview{ margin-top:16px; max-width:100%; border-radius:8px; border:1px solid var(--line); display:none; }
</style>
</head>
<body>

<header class="top">
  <div class="nav-wrap">
    <div class="brand"><span class="mark">BRETT</span><span class="tag">We know</span></div>
    <nav class="links">
      <a href="mainpage.html">Willkommen</a>
      <a href="downloadcenter_new.html">Downloads</a>
      <a href="Online-tools.html" class="active">Onlinetools</a>
      <a href="Lizenz.html">Lizenz</a>
      <a href="brett-spiele.html">Spiele</a>
    </nav>
  </div>
</header>

<main>
  <a class="back-link" href="Online-tools.html">Zurück zu Onlinetools</a>
  <span class="eyebrow">Onlinetool</span>
  <h1 class="page-title">Datei-Converter</h1>
  <p class="lede">Bilder oder Textdateien umwandeln — läuft komplett lokal im Browser.</p>

  <div class="tabs" id="tabs">
    <div class="tab active" data-mode="image">Bildformat</div>
    <div class="tab" data-mode="text">Textdatei</div>
  </div>

  <div class="tool-panel">
    <div class="panel-section active" id="section-image">
      <div class="drop">
        <input type="file" id="imgInput" accept="image/*" />
      </div>
      <div class="field">
        <label for="imgFormat">Zielformat</label>
        <select id="imgFormat">
          <option value="image/png">PNG</option>
          <option value="image/jpeg">JPG</option>
          <option value="image/webp">WebP</option>
        </select>
      </div>
      <button class="tool-btn" id="imgBtn" disabled onclick="convertImage()">Konvertieren & herunterladen</button>
      <img id="imgPreview">
    </div>

    <div class="panel-section" id="section-text">
      <div class="drop">
        <input type="file" id="txtInput" accept=".txt,.csv,.md,.json,.log" />
      </div>
      <div class="field">
        <label for="lineEnding">Zeilenumbrüche</label>
        <select id="lineEnding">
          <option value="lf">Unix/Linux/Mac (LF)</option>
          <option value="crlf">Windows (CRLF)</option>
        </select>
      </div>
      <div class="field">
        <label for="encoding">Kodierung</label>
        <select id="encoding">
          <option value="utf-8">UTF-8</option>
          <option value="utf-8-bom">UTF-8 mit BOM</option>
        </select>
      </div>
      <button class="tool-btn" id="txtBtn" disabled onclick="convertText()">Konvertieren & herunterladen</button>
    </div>
  </div>
</main>

<script>
  document.getElementById('tabs').addEventListener('click', (e) => {
    if (!e.target.classList.contains('tab')) return;
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    document.querySelectorAll('.panel-section').forEach(s => s.classList.remove('active'));
    e.target.classList.add('active');
    document.getElementById('section-' + e.target.dataset.mode).classList.add('active');
  });

  // --- Bildformat ---
  let loadedImg = null;
  document.getElementById('imgInput').addEventListener('change', (e) => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (ev) => {
      const img = new Image();
      img.onload = () => {
        loadedImg = img;
        const preview = document.getElementById('imgPreview');
        preview.src = ev.target.result;
        preview.style.display = 'block';
        document.getElementById('imgBtn').disabled = false;
      };
      img.src = ev.target.result;
    };
    reader.readAsDataURL(file);
  });

  function convertImage() {
    if (!loadedImg) return;
    const canvas = document.createElement('canvas');
    canvas.width = loadedImg.naturalWidth;
    canvas.height = loadedImg.naturalHeight;
    const ctx = canvas.getContext('2d');
    const format = document.getElementById('imgFormat').value;
    if (format === 'image/jpeg') { ctx.fillStyle = '#fff'; ctx.fillRect(0,0,canvas.width,canvas.height); }
    ctx.drawImage(loadedImg, 0, 0);
    canvas.toBlob((blob) => {
      const url = URL.createObjectURL(blob);
      const ext = format === 'image/png' ? 'png' : format === 'image/webp' ? 'webp' : 'jpg';
      const a = document.createElement('a');
      a.href = url; a.download = 'konvertiert.' + ext; a.click();
      URL.revokeObjectURL(url);
    }, format, 0.92);
  }

  // --- Textdatei ---
  let loadedText = null;
  document.getElementById('txtInput').addEventListener('change', (e) => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (ev) => {
      loadedText = ev.target.result;
      document.getElementById('txtBtn').disabled = false;
    };
    reader.readAsText(file, 'UTF-8');
  });

  function convertText() {
    if (loadedText === null) return;
    let text = loadedText.replace(/\r\n/g, '\n');
    if (document.getElementById('lineEnding').value === 'crlf') {
      text = text.replace(/\n/g, '\r\n');
    }
    const withBom = document.getElementById('encoding').value === 'utf-8-bom';
    const blob = new Blob([withBom ? '\ufeff' + text : text], { type: 'text/plain;charset=utf-8' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = 'konvertiert.txt'; a.click();
    URL.revokeObjectURL(url);
  }
</script>

</body>
</html>
