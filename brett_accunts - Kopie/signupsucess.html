
<html>
<style>
html, body {
  height: 100%;
  margin: 0;
}
body {
  font-family: "Arial", sans-serif;
  display: flex;
  justify-content: center;
  align-items: center;
}

.box {
  width: 400px;
  padding: 20px;
  border: 1px solid #333;
  background-color: #f5f5f5;
}
.rot { color: red; }
.blau { color: blue; }
.gruen { color: green; }
.orangefarbig { color: orange; }

.btn {
  background: #00aaff;
  color: white;
  border: none;
  padding: 8px 12px;
  border-radius: 4px;
  cursor: pointer;
  font-size: 14px;
}
loader {
  border: 6px solid #f3f3f3;
  border-top: 6px solid #3498db;
  border-radius: 50%;
  width: 40px;
  height: 40px;
  margin: 10px auto;
  animation: spin 1s linear infinite;
}

@keyframes spin {
  0% { transform: rotate(0deg); }
  100% { transform: rotate(360deg); }
}


</style>

<body>

<div class="box">
  <p class="gruen">BRETT Login-System</p>
  <p class="blau">Wir freuen uns sehr, dass sie ein neues Konto erstellen wollen!</p>
  <hr>

  <h1 class="blau">Registrieren -Erfolgreich</h1>



  <p id="msg" class="rot">Die Registrierung wurde erfolgreich abgeschlossen. Wir haben ihnen ein E-Mail zugesandt, in dem sie ihre Adresse bestätigen können. Vielen Dank!</p>

 

  <br>
  <a href="logonUI.html" class="orangefarbig">Zurück zur Anmeldeseite</a>
</div>



</body>
</html>
