<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>BRETT Registrierung</title>
<style>
body {
  font-family: Arial;
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
  background: #f5f5f5;
}
.box {
  width: 350px;
  padding: 30px;
  background: white;
  border-radius: 10px;
  box-shadow: 0 5px 15px rgba(0,0,0,0.2);
}
input {
  width: 100%;
  padding: 10px;
  margin-bottom: 15px;
}
button {
  width: 100%;
  padding: 10px;
  background: #ff7043;
  border: none;
  color: white;
  cursor: pointer;
}
</style>
</head>
<body>

<div class="box">
<h2>Registrieren</h2>

<input type="text" placeholder="Name">
<input type="email" placeholder="E-Mail">
<input type="password" placeholder="Passwort">

<button onclick="register()">Registrieren</button>
</div>

<script>
function register() {
  window.location.href = "/BrettWebsite/logonUI.html";
}
</script>

</body>
</html>
