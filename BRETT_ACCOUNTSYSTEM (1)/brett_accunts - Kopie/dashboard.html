<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BRETT Dashboard</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  font-family: Arial, sans-serif;
  background: #0f0f14;
  color: white;
  display: flex;
  height: 100vh;
}

/* ===== SIDEBAR ===== */
.sidebar {
  width: 240px;
  background: #18181f;
  padding: 20px;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
}

.logo {
  font-size: 20px;
  font-weight: bold;
  color: #00c6ff;
  margin-bottom: 30px;
}

.nav a {
  display: block;
  padding: 12px;
  margin-bottom: 10px;
  border-radius: 8px;
  text-decoration: none;
  color: #ccc;
  transition: 0.3s;
}

.nav a:hover {
  background: #00c6ff;
  color: black;
}

.logout {
  margin-top: 20px;
}

.logout button {
  width: 100%;
  padding: 10px;
  border: none;
  background: #ff3b3b;
  color: white;
  border-radius: 6px;
  cursor: pointer;
  transition: 0.3s;
}

.logout button:hover {
  background: #ff0000;
}

/* ===== CONTENT ===== */
.main {
  flex: 1;
  padding: 40px;
  overflow-y: auto;
}

.card {
  background: #1f1f27;
  padding: 20px;
  border-radius: 12px;
  margin-bottom: 20px;
  transition: 0.3s;
}

.card:hover {
  transform: translateY(-3px);
  box-shadow: 0 0 15px rgba(0,198,255,0.4);
}

.card h2 {
  margin-bottom: 10px;
  color: #00c6ff;
}

/* ===== MOBILE ===== */
@media (max-width: 768px) {
  body {
    flex-direction: column;
  }
  .sidebar {
    width: 100%;
    flex-direction: row;
    overflow-x: auto;
  }
  .nav {
    display: flex;
  }
  .nav a {
    margin-right: 10px;
  }
}
</style>
</head>

<body>

<div class="sidebar">
  <div>
    <div class="logo">BRETT</div>
    <div class="nav">
      <a href="#">Dashboard</a>
      <a href="downloadcenter.html">Download Center</a>
      <a href="#">Projekte</a>
      <a href="#">Einstellungen</a>
    </div>
  </div>

  <div class="logout">
    <button id="logoutBtn">Logout</button>
  </div>
</div>

<div class="main">
  <div class="card">
    <h2>Willkommen</h2>
    <p id="user"></p>
  </div>

  <div class="card">
    <h2>System Status</h2>
    <p>BRETT System läuft stabil 🚀</p>
  </div>

  <div class="card">
    <h2>Neuigkeiten</h2>
    <p>Neue Updates und Downloads sind verfügbar.</p>
  </div>
</div>

<script type="module">
import { getSession, logout } from "./auth.js";

const userEl = document.getElementById("user");

// Session prüfen
(async () => {
  const session = await getSession();
  if (!session) {
    window.location.href = "loginUI.html";
    return;
  }
  userEl.textContent = "Eingeloggt als: " + session.user.email;
})();

document.getElementById("logoutBtn").onclick = async () => {
  await logout();
  window.location.href = "loginUI.html";
};
</script>

</body>
</html>
