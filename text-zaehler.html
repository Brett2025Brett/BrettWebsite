<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Zeichen & Wörter zählen — BRETT</title>
<link rel="stylesheet" href="style3.css">
<style>
  .tool-panel{
    background:linear-gradient(180deg, var(--char-2), var(--char));
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:32px;
    margin-top:30px;
    max-width:820px;
  }
  textarea{
    width:100%;
    background:var(--void);
    border:1px solid var(--line);
    color:var(--paper);
    font-family:'Inter', sans-serif;
    font-size:0.95rem;
    padding:14px;
    border-radius:8px;
    outline:none;
    resize:vertical;
    line-height:1.6;
  }
  textarea:focus{ border-color:var(--ember); }
  .stats{
    display:grid; grid-template-columns:repeat(auto-fit, minmax(140px,1fr));
    gap:14px; margin-top:22px;
  }
  .stat{
    background:var(--void); border:1px solid var(--line); border-radius:8px;
    padding:16px; text-align:center;
  }
  .stat .val{ font-family:'Rajdhani',sans-serif; font-weight:700; font-size:1.6rem; color:var(--glow); }
  .stat .lbl{ font-size:0.78rem; color:var(--ash); margin-top:4px; }
</style>
</head>
<body>

<header class="top">
  <div class="nav-wrap">
    <div class="brand"><span class="mark">BRETT</span><span class="tag">We know</span></div>
    <nav class="links">
      <a href="mainpage.html">Willkommen</a>
      <a href="downloadcenter_new.html">Downloads</a>
      <a href="Online-tools.html" class="active">Onlinetools</a>
      <a href="Lizenz.html">Lizenz</a>
      <a href="brett-spiele.html">Spiele</a>
    </nav>
  </div>
</header>

<main>
  <a class="back-link" href="Online-tools.html">Zurück zu Onlinetools</a>
  <span class="eyebrow">Onlinetool</span>
  <h1 class="page-title">Zeichen & Wörter zählen</h1>
  <p class="lede">Text einfügen und live Zeichen, Wörter, Sätze und Lesezeit sehen.</p>

  <div class="tool-panel">
    <textarea id="input" rows="10" placeholder="Text hier einfügen..."></textarea>

    <div class="stats">
      <div class="stat"><div class="val" id="chars">0</div><div class="lbl">Zeichen</div></div>
      <div class="stat"><div class="val" id="charsNoSpace">0</div><div class="lbl">Zeichen (ohne Leerzeichen)</div></div>
      <div class="stat"><div class="val" id="words">0</div><div class="lbl">Wörter</div></div>
      <div class="stat"><div class="val" id="sentences">0</div><div class="lbl">Sätze</div></div>
      <div class="stat"><div class="val" id="lines">0</div><div class="lbl">Zeilen</div></div>
      <div class="stat"><div class="val" id="readtime">0 Min</div><div class="lbl">Lesezeit (ca.)</div></div>
    </div>
  </div>
</main>

<script>
  const input = document.getElementById('input');

  function update() {
    const text = input.value;
    const chars = text.length;
    const charsNoSpace = text.replace(/\s/g, '').length;
    const words = text.trim() === '' ? 0 : text.trim().split(/\s+/).length;
    const sentences = text.trim() === '' ? 0 : (text.match(/[.!?]+(\s|$)/g) || []).length;
    const lines = text === '' ? 0 : text.split(/\n/).length;
    const readtime = Math.max(1, Math.round(words / 200));

    document.getElementById('chars').textContent = chars;
    document.getElementById('charsNoSpace').textContent = charsNoSpace;
    document.getElementById('words').textContent = words;
    document.getElementById('sentences').textContent = sentences;
    document.getElementById('lines').textContent = lines;
    document.getElementById('readtime').textContent = (words === 0 ? 0 : readtime) + ' Min';
  }

  input.addEventListener('input', update);
  update();
</script>

</body>
</html>
