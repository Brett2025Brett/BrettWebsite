<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BRETT | Dashboard</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">

<style>
* {
  box-sizing: border-box;
}
html, body {
  margin: 0;
  height: 100%;
  font-family: 'Inter', sans-serif;
  background: #0f2027;
  color: white;
}

/* Layout */
.wrapper {
  display: flex;
  height: 100%;
}

/* Sidebar */
.sidebar {
  width: 240px;
  background: #111;
  padding: 25px;
  display: flex;
  flex-direction: column;
  gap: 20px;
  transition: transform 0.3s ease;
}

.sidebar h2 {
  margin: 0;
  color: #00c6ff;
}

.sidebar a {
  text-decoration: none;
  color: white;
  padding: 10px 0;
  transition: 0.2s;
}

.sidebar a:hover {
  color: #00c6ff;
}

/* Main */
.main {
  flex: 1;
  padding: 30px 40px;
}

.header {
  font-size: 26px;
  font-weight: 600;
}

.user-info {
  margin-bottom: 30px;
  opacity: 0.8;
}

/* Cards */
.cards {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
  gap: 20px;
  margin-bottom: 40px;
}

.card {
  background: rgba(255,255,255,0.08);
  padding: 20px;
  border-radius: 16px;
  backdrop-filter: blur(10px);
}

.card h3 {
  margin-top: 0;
  color: #00c6ff;
}

/* Downloads */
.downloads a {
  display: block;
  background: #0072ff;
  padding: 12px;
  border-radius: 10px;
  text-decoration: none;
  color: white;
  margin-bottom: 10px;
  font-weight: 600;
  transition: 0.3s;
}

.downloads a:hover {
  background: #00c6ff;
}

/* Logout */
.logout-btn {
  margin-top: auto;
  padding: 12px;
  border: none;
  border-radius: 10px;
  background: #ff4b2b;
  color: white;
  cursor: pointer;
  transition: 0.3s;
}

.logout-btn:hover {
  background: #ff416c;
}

/* Hamburger Button */
.hamburger {
  display: none;
  position: fixed;
  top: 20px;
  left: 20px;
  font-size: 28px;
  cursor: pointer;
  z-index: 1001;
}

/* Overlay */
.overlay {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.5);
  z-index: 1000;
}

/* Mobile */
@media (max-width: 768px) {
  .sidebar {
    position: fixed;
    height: 100%;
    transform: translateX(-100%);
    z-index: 1002;
  }

  .sidebar.active {
    transform: translateX(0);
  }

  .hamburger {
    display: block;
  }

  .overlay.active {
    display: block;
  }

  .main {
    padding: 80px 20px 20px 20px;
  }
}
</style>
</head>

<body>

<div class="hamburger" id="hamburger">☰</div>
<div class="overlay" id="overlay"></div>

<div class="wrapper">

  <div class="sidebar" id="sidebar">
    <h2>BRETT</h2>
    <a href="#">Dashboard</a>
    <a href="#">Downloads</a>
    <a href="#">Einstellungen</a>
    <button id="logoutBtn" class="logout-btn">Logout</button>
  </div>

  <div class="main">
    <div class="header">Willkommen 👋</div>
    <p id="user" class="user-info"></p>

    <div class="cards">
      <div class="card">
        <h3>Profil</h3>
        <p id="cardEmail"></p>
      </div>

      <div class="card">
        <h3>Status</h3>
        <p>Aktiv & angemeldet</p>
      </div>

      <div class="card">
        <h3>System</h3>
        <p>BRETT Dashboard v1.0</p>
      </div>
    </div>

    <div class="downloads">
      <h3>Downloads</h3>
      <a href="#">BRETTBrowser</a>
      <a href="#">MusikBrett</a>
      <a href="#">Zeichenbrett Pro</a>
    </div>
  </div>

</div>

<script type="module">
  import { getSession, logout } from "./auth.js";

  const sidebar = document.getElementById("sidebar");
  const hamburger = document.getElementById("hamburger");
  const overlay = document.getElementById("overlay");
  const userEl = document.getElementById("user");
  const emailCard = document.getElementById("cardEmail");

  // Sidebar Toggle
  hamburger.onclick = () => {
    sidebar.classList.toggle("active");
    overlay.classList.toggle("active");
  };

  overlay.onclick = () => {
    sidebar.classList.remove("active");
    overlay.classList.remove("active");
  };

  // Session prüfen
  (async () => {
    const session = await getSession();
    if (!session) {
      window.location.href = "logonUI.html";
      return;
    }
    userEl.textContent = "Eingeloggt als: " + session.user.email;
    emailCard.textContent = session.user.email;
  })();

  document.getElementById("logoutBtn").onclick = async () => {
    await logout();
    window.location.href = "logonUI.html";
  };
</script>

</body>
</html>
